name: llm-ontology

services:
  neo4j:
    image: neo4j:5-community
    container_name: Neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j2026
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: no
  ##**修改容器重启策略（全部改成手动）本身不会直接干掉端口映射，但是你是在 Docker Desktop 面板批量更新 `restartPolicy=no`，
  ##这个操作有一个隐藏坑：**
  ##用 UI 面板批量 `update` 修改容器重启策略，**不会重建容器，只是改容器元信息；但是 WSL2 的网络沙箱会发生异常，后续你用 `docker start` 启动旧容器的时候，网络端口转发规则创建失败，就出现：`HostConfig.PortBindings`配置存在，但是运行时`NetworkSettings.Ports={"3306/tcp":[]}`**
  ##现在想要**手动启动**，yml 里 mysql 加上 `restart: "no"`

  # 业务数据存储（用户/配置/会话/评测），与 application.yml 的
  # jdbc:mysql://localhost:3306/ontology（root/root）对应
  mysql:
    image: mysql:8.0
    container_name: ontology-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ontology
    command:
      - --character-set-server=utf8mb4
      # 镜像现网容器实际启动参数（非 utf8mb4_bin）：仅影响未显式指定 collation 的新建表，
      # 现有 32 表的 collation 已在建表时固定，收编前后行为零漂移
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: no

volumes:
  # 显式指定卷名，避免 compose 拼接项目前缀形成 neo4j_neo4j_data 双层嵌套
  neo4j_data:
    name: neo4j_data
  neo4j_logs:
    name: neo4j_logs
  # 复用现网 mysql 容器（docker run 创建）的既有卷，数据零迁移
  mysql_data:
    name: ontology-mysql-data
