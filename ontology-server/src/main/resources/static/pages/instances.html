<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实例列表</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
<style>
tr.data-row { cursor: pointer; }
.pager { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn { padding: 5px 14px; text-decoration: none; }
.btn:disabled, .btn.disabled { background: #d1d5db; cursor: not-allowed; }
input[type=number] { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; width: 80px; }
.detail-row td { background: #f9fafb; padding: 12px 18px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 4px 24px; }
.detail-item { font-size: 13px; word-break: break-all; margin-bottom: 0; }
.detail-item b { width: auto; }
.detail-item.long { grid-column: 1 / -1; }
/* 相关文档块（P1 反向溯源：节点 _sourceFile → wiki 文档，懒加载，仅 ADMIN） */
.rel-docs { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e5e7eb; }
.rel-docs-t { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
.rel-doc-link { display: inline-block; margin: 0 14px 4px 0; font-size: 13px; color: #2563eb; text-decoration: none; }
.rel-doc-link:hover { text-decoration: underline; }
.empty { padding: 40px; text-align: center; color: #9ca3af; }
.search-bar { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
.search-bar input[type=text] { flex: 0 1 320px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2 id="page-title">实例列表</h2>
    <div class="search-bar">
      <input type="text" id="kw" placeholder="输入关键词，匹配实例任意属性" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn" onclick="doSearch()">搜索</button>
      <a class="btn ghost" id="reset" href="javascript:void(0)" onclick="clearSearch()" style="display:none">重置</a>
    </div>
    <div id="list"></div>
    <div id="pager" class="pager"></div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const LABEL = qs.get('label') || '';
const Q = (qs.get('q') || '').trim();
const SIZE = 50;
let page = Math.max(1, parseInt(qs.get('page')) || 1);
let propDefs = [];   // schema 属性定义（含中文名），用于详情展示
let curRows = [];    // 当前页实例行缓存（相关文档懒加载取 props._sourceFile 用）
let me = null;       // 当前用户（「相关文档」块仅 ADMIN 请求 by-source）

function href(p) {
  return `/instances?label=${encodeURIComponent(LABEL)}&page=${p}` + (Q ? `&q=${encodeURIComponent(Q)}` : '');
}

function fmt(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'string' && v.length > 80) return v.slice(0, 80) + '…';
  return v;
}

function renderTitle(cls, data) {
  const cn = cls ? cls.cnName : LABEL;
  const countText = Q ? `关键词“<b>${esc(Q)}</b>”匹配 ${data.total} 条实例` : `共 ${data.total} 条实例`;
  $('page-title').innerHTML =
    `${esc(LABEL)} · ${esc(cn)} ${cls ? badge(cls.layer) : ''}
     <span class="muted" style="margin-left:12px">${countText}（key：<code>${esc(data.keyProp)}</code>，每页 ${data.size} 条）· 点击行查看图谱，▾ 展开属性</span>`;
}

function renderList(data) {
  curRows = data.rows;
  if (!data.rows.length) {
    $('list').innerHTML = Q ? `<div class="empty">未找到匹配“${esc(Q)}”的实例</div>` : '<div class="empty">该类型暂无实例</div>';
    $('pager').innerHTML = '';
    return;
  }
  const start = (data.page - 1) * data.size;
  const rows = data.rows.map((r, i) => {
    const name = r.props.title ?? r.props.name ?? r.props.cnName ?? '-';
    const detail = Object.entries(r.props).map(([k, v]) => {
      const def = propDefs.find(p => p.name === k);
      const cn = def ? def.cnName : k;
      const isLong = typeof v === 'string' && v.length > 80;
      return `<div class="detail-item${isLong ? ' long' : ''}"><b>${esc(cn)}</b>${esc(v)}</div>`;
    }).join('');
    const keyEnc = encodeURIComponent(String(r.key)).replace(/'/g, '%27');
    const srcFile = r.props._sourceFile;
    return `<tr class="data-row" onclick="gotoGraph('${keyEnc}')" title="点击查看实例图谱">
        <td class="muted">${start + i + 1}</td>
        <td><code>${esc(r.key)}</code></td>
        <td>${esc(fmt(name))}</td>
        <td class="muted" style="cursor:pointer;width:40px" title="展开/收起属性" onclick="event.stopPropagation();toggleDetail(${i})">▾</td>
      </tr>
      <tr class="detail-row" id="detail-${i}" style="display:none">
        <td colspan="4"><div class="detail-grid">${detail}</div>${srcFile ? `<div class="rel-docs" id="rel-${i}"></div>` : ''}</td>
      </tr>`;
  }).join('');
  $('list').innerHTML =
    `<table><tr><th style="width:60px">#</th><th style="width:180px">${esc(data.keyProp)}</th><th>名称</th><th style="width:40px"></th></tr>${rows}</table>`;
}

function renderPager(data) {
  const pages = data.pages, cur = data.page;
  if (pages <= 1) { $('pager').innerHTML = `<span class="muted">共 ${data.total} 条</span>`; return; }
  const prev = cur > 1 ? `<a class="btn ghost" href="${href(cur - 1)}">上一页</a>` : `<span class="btn ghost disabled">上一页</span>`;
  const next = cur < pages ? `<a class="btn ghost" href="${href(cur + 1)}">下一页</a>` : `<span class="btn ghost disabled">下一页</span>`;
  const first = cur > 1 ? `<a class="btn ghost" href="${href(1)}">首页</a>` : '';
  const last = cur < pages ? `<a class="btn ghost" href="${href(pages)}">末页</a>` : '';
  $('pager').innerHTML = `${first}${prev}
    <span>第 <b>${cur}</b> / ${pages} 页（共 ${data.total} 条）</span>
    ${next}${last}
    <span style="margin-left:12px">跳至
      <input type="number" id="jump" min="1" max="${pages}" value="${cur}">
      <button class="btn" onclick="jumpPage(${pages})">GO</button>
    </span>`;
}

function toggleDetail(i) {
  const el = $('detail-' + i);
  const show = el.style.display === 'none';
  el.style.display = show ? '' : 'none';
  if (show) loadRelDocs(i);   // 展开时懒加载「相关文档」（节点带 _sourceFile 且当前用户为 ADMIN）
}

// P1 反向溯源：props._sourceFile（原始上传文件名）→ /api/wiki/by-source → wiki 文档标题链接
// 无溯源字段 / 非 ADMIN / 查询无结果 → 不渲染该块（不显示空区块）；请求失败静默降级
async function loadRelDocs(i) {
  const box = $('rel-' + i);
  const srcFile = curRows[i] && curRows[i].props && curRows[i].props._sourceFile;
  if (!box || !srcFile || box.dataset.loaded) return;
  box.dataset.loaded = '1';
  if (!me || me.role !== 'ADMIN') return;
  try {
    const d = await api('GET', '/api/wiki/by-source?file=' + encodeURIComponent(String(srcFile)));
    if (d.docs && d.docs.length) {
      box.innerHTML = '<div class="rel-docs-t">相关文档</div>' +
        d.docs.map(x => `<a class="rel-doc-link" href="/wiki?doc=${encodeURIComponent(x.mdName)}" title="${esc(x.sourceName)}">${esc(x.title)}</a>`).join('');
    }
  } catch (e) { /* 增强信息，失败静默 */ }
}
function gotoGraph(keyEnc) {
  location.href = '/graph?label=' + encodeURIComponent(LABEL) + '&key=' + keyEnc;
}
function jumpPage(pages) {
  const p = Math.min(Math.max(1, parseInt($('jump').value) || 1), pages);
  location.href = href(p);
}
function doSearch() {
  const kw = $('kw').value.trim();
  location.href = `/instances?label=${encodeURIComponent(LABEL)}&page=1` + (kw ? `&q=${encodeURIComponent(kw)}` : '');
}
function clearSearch() {
  $('kw').value = '';
  if (Q) location.href = `/instances?label=${encodeURIComponent(LABEL)}&page=1`;
}

async function init() {
  try {
    $('kw').value = Q;
    $('reset').style.display = Q ? '' : 'none';
    const schema = await api('GET', '/api/schema');
    const cls = schema.classes.find(c => c.name === LABEL);
    if (cls) propDefs = cls.properties || [];
    let apiUrl = `/api/graph/nodes?label=${encodeURIComponent(LABEL)}&page=${page}&size=${SIZE}`;
    if (Q) apiUrl += `&q=${encodeURIComponent(Q)}`;
    const data = await api('GET', apiUrl);
    page = data.page;
    renderTitle(cls, data);
    renderList(data);
    renderPager(data);
  } catch (e) {
    $('list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

// header 渲染 + 登录校验由 common.js 提供（回调保存当前用户，「相关文档」按 ADMIN 门控）
CF.renderHeader();
CF.initUser(u => { me = u; });
init();
</script>
</body>
</html>
