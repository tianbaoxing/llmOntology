<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 问答</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
.btn:disabled { background: #93c5fd; cursor: not-allowed; }
.btn.ghost { background: #374151; color: #fff; }
.btn.ghost:hover { background: #4b5563; }
.btn.stop { background: #dc2626; }
.btn.stop:hover { background: #b91c1c; }
.layout { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 250px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; }
/* 侧边栏操作按钮：并排等宽；新会话为主操作（实心蓝），提示词为次操作（描边中性） */
.side-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
.side-btn.new { background: #2563eb; color: #fff; }
.side-btn.new:hover { background: #1d4ed8; }
.side-btn.pmt { background: #fff; color: #374151; border-color: #d1d5db; }
.side-btn.pmt:hover { color: #2563eb; border-color: #93c5fd; background: #eff6ff; }
.side-title { font-size: 12px; color: #9ca3af; padding: 10px 16px 6px; }
.sess-list { flex: 1; overflow-y: auto; }
.sess-item { position: relative; padding: 10px 14px 10px 17px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
.sess-item:hover { background: #f9fafb; }
.sess-item.active { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; }
.sess-title { font-size: 13px; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
.sess-time { font-size: 12px; color: #9ca3af; margin-top: 3px; }
.sess-del { display: none; position: absolute; right: 8px; top: 10px; color: #9ca3af; font-size: 12px; cursor: pointer; padding: 2px 4px; }
.sess-item:hover .sess-del { display: block; }
.sess-del:hover { color: #dc2626; }
/* 会话标题搜索框（按标题即时过滤会话列表） */
.side-search { padding: 0 14px 10px; }
.side-search input { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; color: #1f2937; background: #f9fafb; }
.side-search input:focus { outline: none; border-color: #2563eb; background: #fff; }
.side-search input::placeholder { color: #9ca3af; }
.sess-empty { padding: 24px 14px; text-align: center; color: #9ca3af; font-size: 13px; }
/* 双击重命名的内联编辑输入框 */
.sess-title input.rename { width: 100%; box-sizing: border-box; padding: 2px 6px; border: 1px solid #2563eb; border-radius: 4px; font-size: 13px; color: #1f2937; }
.sess-title input.rename:focus { outline: none; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 900px; width: 100%; margin: 0 auto; }
.messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.msg-user { align-self: flex-end; max-width: 78%; background: #2563eb; color: #fff; padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; word-break: break-word; }
.msg-agent { align-self: flex-start; max-width: 92%; background: #fff; border-radius: 12px 12px 12px 2px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); word-break: break-word; }
.msg-agent .answer { white-space: pre-wrap; line-height: 1.7; }
.msg-agent .answer:empty::after { content: "…"; color: #9ca3af; }
.think-box, .tool-box { border: 1px dashed #d1d5db; border-radius: 8px; margin-bottom: 10px; font-size: 13px; background: #f9fafb; }
.think-box summary, .tool-box summary { cursor: pointer; padding: 6px 12px; color: #6b7280; user-select: none; }
.think-box summary::before { content: "🧠 "; }
.tool-box summary::before { content: "🔧 "; }
.think-box .inner, .tool-box .inner { padding: 4px 12px 10px; color: #6b7280; white-space: pre-wrap; max-height: 260px; overflow-y: auto; line-height: 1.6; }
.tool-box .inner .tool-line { padding: 2px 0; }
.tool-box .inner .tool-line .tname { color: #1d4ed8; font-family: Consolas, monospace; }
.tool-box .inner .tool-line.end .tname { color: #15803d; }
.tool-box .inner .tool-line .targs { margin: 2px 0 2px 16px; font-family: Consolas, monospace; font-size: 12px; color: #6b7280; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; }
.tool-box .inner .tool-line .toutput { margin: 2px 0 2px 16px; font-family: Consolas, monospace; font-size: 12px; color: #374151; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; background: #f3f4f6; border-radius: 4px; padding: 4px 6px; }
.tool-box .inner .tool-line .toutput.err { color: #b91c1c; background: #fef2f2; }
.err-text { color: #b91c1c; white-space: pre-wrap; }
.usage { color: #9ca3af; font-size: 12px; margin-top: 8px; }
.usage-total { color: #6b7280; }
/* 记忆压缩卡片与会话转录恢复的「压缩前记录」角标 */
.compaction-card { align-self: stretch; border: 1px dashed #c4b5fd; border-radius: 8px; background: #f5f3ff; font-size: 13px; }
.compaction-card summary { cursor: pointer; padding: 6px 12px; color: #6d28d9; user-select: none; }
.compaction-card .cc-inner { padding: 4px 12px 10px; color: #6b7280; max-height: 300px; overflow-y: auto; line-height: 1.6; }
.compaction-card .cc-text { white-space: pre-wrap; word-break: break-word; }
.compaction-card .cc-file { margin-top: 6px; font-family: Consolas, monospace; font-size: 12px; color: #6d28d9; word-break: break-all; }
.compaction-card .cc-ts { margin-top: 4px; font-size: 12px; color: #9ca3af; }
.flat-tag { display: inline-block; font-size: 11px; line-height: 1.5; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 0 8px; margin-bottom: 6px; cursor: default; }
.msg-user .flat-tag { color: #fff; background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
/* usage 行右侧挂「存为评测样本」入口（仅 ADMIN）：行变 flex，按钮靠右 */
.usage.has-eval { display: flex; align-items: center; }
.usage.has-eval .to-eval { margin-left: auto; }
.to-eval { flex: none; border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280; font-size: 12px; padding: 2px 10px; border-radius: 12px; cursor: pointer; }
.to-eval:hover { color: #2563eb; border-color: #93c5fd; background: #eff6ff; }
.caret { display: inline-block; width: 7px; height: 15px; background: #2563eb; vertical-align: -2px; animation: blink .9s infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
/* ---------- 轮次刻度导航：消息区左侧，每条用户消息一个刻度横线，点击跳转到该条消息 ---------- */
.msg-area { flex: 1; min-height: 0; display: flex; }
.turn-rail { position: relative; width: 44px; flex-shrink: 0; display: none; }
.turn-rail.show { display: block; }
.turn-rail::before { content: ""; position: absolute; left: 21px; top: 20px; bottom: 20px; width: 2px; background: #e5e7eb; border-radius: 999px; }
.turn-vp { position: absolute; left: 4px; right: 4px; top: 20px; height: 36px; background: rgba(37,99,235,.10); border: 1px solid rgba(37,99,235,.35); border-radius: 999px; pointer-events: none; display: none; }
.turn-tick { position: absolute; left: 0; width: 44px; height: 16px; display: flex; align-items: center; padding: 0 0 0 14px; background: none; border: none; cursor: pointer; transform: translateY(-50%); }
.turn-tick:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; border-radius: 8px; }
.turn-tick .bar { width: 16px; height: 2px; border-radius: 999px; background: #9ca3af; opacity: .55; }
.turn-tick:hover .bar, .turn-tick.active .bar { width: 26px; background: #2563eb; opacity: 1; }
.turn-tick .tip { display: none; position: absolute; left: 44px; top: 50%; transform: translateY(-50%); max-width: 260px; padding: 4px 8px; background: #1f2937; color: #f9fafb; font-size: 12px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 8px; z-index: 10; }
.turn-tick:hover .tip, .turn-tick:focus-visible .tip { display: block; }
.turn-tick .tip b { font-weight: 600; margin-right: 4px; }
.turn-pos { margin-left: auto; font-size: 12px; color: #9ca3af; flex-shrink: 0; }
@media (prefers-reduced-motion: no-preference) {
  .turn-tick .bar { transition: width .12s ease, background .12s ease, opacity .12s ease; }
  .msg-user.flash { animation: turn-flash 1.1s ease-out; }
}
@keyframes turn-flash { from { box-shadow: 0 0 0 4px rgba(37,99,235,.45); } to { box-shadow: 0 0 0 4px transparent; } }
.input-area { background: #fff; border-top: 1px solid #e5e7eb; padding: 14px 24px; }
.tools-bar { display: flex; align-items: center; gap: 8px; max-width: 900px; margin: 0 auto 10px; }
.skills-row { display: none; gap: 8px; flex: 1; flex-wrap: wrap; padding-bottom: 2px; }
.skills-row.show { display: flex; }
.skill-chip { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 16px; background: #f9fafb; color: #374151; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; }
.skill-chip:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
.skill-chip .tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 0; width: max-content; max-width: 360px; padding: 8px 10px; background: #1f2937; color: #f9fafb; border-radius: 8px; font-size: 12px; line-height: 1.6; white-space: normal; z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.skill-chip:hover .tip { display: block; }
.input-row { display: flex; gap: 10px; align-items: flex-end; max-width: 900px; margin: 0 auto; }
textarea { flex: 1; width: 100%; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.5; }
textarea:focus { outline: none; border-color: #2563eb; }
/* ---------- “/” 工具快捷菜单 ---------- */
.slash-wrap { position: relative; flex: 1; display: flex; }
.slash-menu { display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 280px; overflow-y: auto; background: #1f2937; color: #f9fafb; border-radius: 8px; padding: 6px; z-index: 20; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.slash-menu .s-item { padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.slash-menu .s-item.active, .slash-menu .s-item:hover { background: #374151; }
.slash-menu .s-name { font-family: Consolas, monospace; color: #93c5fd; font-size: 13px; }
.slash-menu .s-desc { font-size: 12px; color: #d1d5db; margin-top: 2px; white-space: normal; word-break: break-word; line-height: 1.5; }
.slash-menu .s-empty { padding: 8px 10px; font-size: 12px; color: #9ca3af; }
.hint { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 8px; }
.empty-tip { margin: auto; text-align: center; color: #9ca3af; }
.empty-tip .big { font-size: 15px; margin-bottom: 8px; }
.chat-head { flex-shrink: 0; display: flex; align-items: baseline; gap: 8px; padding: 12px 24px 10px; border-bottom: 1px solid #f3f4f6; }
.resume-tip { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: #fef9c3; border: 1px solid #fde047; border-radius: 8px; color: #713f12; font-size: 13px; }
.resume-tip .btn { padding: 4px 12px; font-size: 12px; }
.chat-head .chat-label { font-size: 12px; color: #9ca3af; flex-shrink: 0; }
.chat-head .chat-title { font-size: 13px; color: #374151; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ---------- 图表与表格渲染样式 ---------- */
.msg-agent .chart-container { width: 100%; height: 280px; margin: 10px 0; }
.msg-agent table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
.msg-agent table th { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 6px 10px; text-align: left; font-weight: 600; }
.msg-agent table td { border: 1px solid #e5e7eb; padding: 6px 10px; color: #374151; }
.msg-agent table tbody tr:nth-child(even) td { background: #f9fafb; }
.msg-agent pre { background: #f3f4f6; padding: 8px 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
.msg-agent code { font-family: Consolas, monospace; font-size: 12px; }
.msg-agent :not(pre) > code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; color: #b45309; }
.msg-agent blockquote { border-left: 3px solid #bfdbfe; color: #6b7280; margin: 8px 0; padding: 2px 12px; }
.msg-agent p { margin: 4px 0; }
.msg-agent ul, .msg-agent ol { padding-left: 22px; margin: 4px 0; }
.msg-agent h1, .msg-agent h2, .msg-agent h3, .msg-agent h4 { margin: 10px 0 6px; color: #1f2937; }
.msg-agent hr { border: none; border-top: 1px solid #e5e7eb; margin: 12px 0; }
.msg-agent a { color: #2563eb; text-decoration: none; }
.msg-agent a:hover { text-decoration: underline; }
.stopped-tag { display: inline-block; margin-top: 8px; color: #9ca3af; font-size: 13px; }
/* maxIters 超限提示条：强制收尾轮后展示「继续执行任务」续跑入口 */
.limit-notice { align-self: stretch; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: #fef9c3; border: 1px solid #fde047; border-radius: 8px; color: #713f12; font-size: 13px; }
.limit-notice .limit-continue { flex: none; border: 1px solid #fde047; background: #fffbeb; color: #854d0e; font-size: 12px; padding: 3px 12px; border-radius: 12px; cursor: pointer; }
.limit-notice .limit-continue:hover { background: #fde047; color: #713f12; }
/* ---------- 用户提示词 ---------- */
/* 用户消息气泡 hover 出「存为提示词」入口（悬浮气泡右上角） */
.msg-user { position: relative; }
.to-prompt { display: none; position: absolute; right: 8px; top: -9px; border: 1px solid rgba(255,255,255,.55); background: #2563eb; color: #fff; font-size: 11px; line-height: 1.6; padding: 1px 8px; border-radius: 10px; cursor: pointer; white-space: nowrap; z-index: 5; }
.msg-user:hover .to-prompt { display: inline-block; }
.to-prompt:hover { background: #1d4ed8; }
/* 提示词管理弹窗 */
.modal-mask { display: none; position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 100; align-items: center; justify-content: center; }
.modal-mask.show { display: flex; }
.modal-box { background: #fff; border-radius: 10px; width: 760px; max-width: 94vw; max-height: 82vh; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid #e5e7eb; font-weight: 600; color: #1f2937; }
.modal-head .m-close { margin-left: auto; color: #9ca3af; cursor: pointer; font-size: 16px; padding: 2px 6px; }
.modal-head .m-close:hover { color: #dc2626; }
.modal-body { padding: 14px 18px; overflow-y: auto; }
.modal-body .toolbar { margin-bottom: 10px; }
.pf-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.pf-field .pf-label { font-size: 13px; color: #374151; }
.pf-field input[type=text] { width: 100%; box-sizing: border-box; }
.pf-form textarea { min-height: 130px; max-height: 260px; height: auto; resize: vertical; font-size: 13px; }
.pf-actions { display: flex; gap: 8px; align-items: center; }
.pf-err { color: #b91c1c; font-size: 12px; }
.pf-empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 24px 0; }
.p-op { cursor: pointer; color: #2563eb; margin-right: 10px; font-size: 13px; }
.p-op:hover { text-decoration: underline; }
.p-op.del { color: #dc2626; }
.p-content { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6b7280; }
/* 提示词 → skill */
.p-op.skill { color: #059669; }
.ps-tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 1px 8px; border-radius: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; font-size: 11px; cursor: pointer; }
.ps-tag:hover { background: #d1fae5; }
.ps-tag .x { font-weight: 700; }
.pf-preview { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; color: #374151; }
.ps-tip { font-size: 12px; color: #9ca3af; margin-top: 6px; }
/* 自建智能体开场白气泡徽标 */
.greet-tag { display: inline-block; margin-bottom: 6px; padding: 1px 10px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 11px; }
.agent-sel { font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; padding: 3px 8px; color: #374151; max-width: 220px; background: #fff; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="side-head">
      <button class="side-btn new" id="btn-new">+ 新会话</button>
      <button class="side-btn pmt" id="btn-prompts">提示词</button>
    </div>
    <div class="side-title">历史会话</div>
    <div class="side-search"><input type="text" id="sess-search" placeholder="搜索会话标题" autocomplete="off"></div>
    <div class="sess-list" id="sess-list"></div>
  </div>
  <div class="main">
    <div class="chat-wrap">
    <div class="chat-head"><span class="chat-label">当前会话</span><span class="chat-title" id="chat-title">新会话</span><span class="turn-pos" id="turn-pos"></span></div>
    <div class="msg-area">
    <div class="turn-rail" id="turn-rail" aria-label="消息定位导航"><div class="turn-vp" id="turn-vp"></div></div>
    <div class="messages" id="messages">
      <div class="empty-tip" id="empty-tip">
        <div class="big">向 AI 助手提问<span id="tip-title"></span>相关问题</div>
        <div>回答过程会实时展示思考与执行过程</div>
      </div>
    </div>
    </div>
    <div class="input-area">
      <div class="tools-bar">
        <select class="agent-sel" id="agent-sel" title="选择问答智能体（自建智能体来自「智能体搭建」页上架的实例）" style="display:none"></select>
        <div class="skills-row" id="skills-row"></div>
      </div>
      <div class="input-row">
        <div class="slash-wrap">
          <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行；输入 / 唤起工具，# 唤起提示词" rows="1"></textarea>
          <div class="slash-menu" id="slash-menu"></div>
          <div class="slash-menu" id="prompt-menu"></div>
        </div>
        <button class="btn" id="btn-send">发送</button>
        <button class="btn stop" id="btn-stop" style="display:none;">停止</button>
      </div>
      <div class="hint" id="ai-hint"></div>
    </div>
    </div>
  </div>
</div>

<!-- 用户提示词管理弹窗 -->
<div class="modal-mask" id="prompt-modal">
  <div class="modal-box">
    <div class="modal-head"><span>提示词管理</span><span class="m-close" id="pm-close" title="关闭">✕</span></div>
    <div class="modal-body">
      <div class="toolbar" id="pm-list-view">
        <button class="btn sm" id="pm-add">+ 新增提示词</button>
        <span class="muted" id="pm-count"></span>
      </div>
      <div id="pm-table"></div>
      <div class="pf-form" id="pm-form" style="display:none;">
        <div class="pf-field">
          <div class="pf-label">标题（# 菜单展示与过滤，最长 50 字）</div>
          <input type="text" id="pm-title" maxlength="50" placeholder="如：文物年代查询">
        </div>
        <div class="pf-field">
          <div class="pf-label">内容（选中后填充到输入框，最长 5000 字）</div>
          <textarea id="pm-content" placeholder="提示词全文"></textarea>
        </div>
        <div class="pf-actions">
          <button class="btn sm" id="pm-save">保存</button>
          <button class="btn sm ghost" id="pm-cancel">取消</button>
          <span class="pf-err" id="pm-err"></span>
        </div>
      </div>
      <div class="pf-form" id="pm-skill-form" style="display:none;">
        <div class="pf-field">
          <div class="pf-label">skill 名（小写字母、数字、连字符；默认自动生成，可改为语义名）</div>
          <input type="text" id="ps-name" maxlength="64" placeholder="如 user-bronze-age">
        </div>
        <div class="pf-field">
          <div class="pf-label">description（告诉 LLM 何时应用本技能，最长 1024 字）</div>
          <textarea id="ps-desc" maxlength="1024" style="min-height:64px;"></textarea>

<script>
const messagesEl = $('messages');
const inputEl = $('input');
const btnSend = $('btn-send');
const btnStop = $('btn-stop');

// ---------- ECharts 实例生命周期管理 ----------
const _chartInstances = new Set();
function disposeAllCharts() {
  if (!window.echarts) return;
  for (const inst of _chartInstances) {
    try { inst.dispose(); } catch (e) {}
  }
  _chartInstances.clear();
}
window.addEventListener('resize', () => {
  if (!window.echarts) return;
  for (const inst of _chartInstances) {
    try { inst.resize(); } catch (e) {}
  }
});

// ---------- Markdown + 图表渲染管线 ----------
/**
 * 1. 取 answer.textContent 完整文本
 * 2. marked 解析 → HTML（表格、代码块）
 * 3. 提取 <code class="language-chart"> 块 → JSON.parse
 *    → 替换为图表容器 div（失败则保留原文本块，不中断）
 * 4. DOMPurify 清洗 → answer.innerHTML
 * 5. 遍历图表容器 → echarts.init + setOption（按 type 映射）
 */
function renderAnswerContent(answerEl) {
  if (!answerEl) return;
  const raw = answerEl.textContent || '';
  if (!raw) return;

  // ---- 2. marked 解析 ----
  let html;
  try {
    const mdOpt = { gfm: true, breaks: true };
    if (window.marked.parse) html = window.marked.parse(raw, mdOpt);
    else html = window.marked(raw, mdOpt);
  } catch (e) {
    // marked 异常：兜底回退纯文本（转义）展示
    answerEl.textContent = raw;
    return;
  }

  // ---- 3. 提取 chart 代码块，替换为容器 ----
  // marked 的代码块围栏 ```chart 生成 <code class="language-chart">
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const chartCodes = tmp.querySelectorAll('code.language-chart, code[class*="language-chart"]');
  const chartContainers = []; // { div, json }
  chartCodes.forEach(code => {
    const jsonStr = (code.textContent || '').trim();
    let chartCfg = null;
    try { chartCfg = JSON.parse(jsonStr); } catch (e) {}
    const pre = code.parentElement;
    const holder = document.createElement('div');
    if (chartCfg && window.echarts) {
      holder.className = 'chart-container';
      holder.dataset.chartCfg = jsonStr;
      chartContainers.push(holder);
    } else {
      // 解析失败或未加载 echarts：保留原始 JSON 作为代码块展示
      holder.className = 'chart-parse-failed';
      const p = document.createElement('pre');
      const c = document.createElement('code');
      c.className = 'language-text';
      c.textContent = jsonStr || '（空图表数据）';
      p.appendChild(c);
      holder.appendChild(p);
    }
    if (pre && pre.tagName === 'PRE') pre.replaceWith(holder);
    else code.replaceWith(holder);
  });
  html = tmp.innerHTML;

  // ---- 4. DOMPurify 清洗后写入 ----
  let cleanHtml;
  try {
    cleanHtml = window.DOMPurify.sanitize(html, {
      ADD_ATTR: ['target', 'data-chart-cfg'],
      ADD_TAGS: ['svg', 'path', 'circle', 'rect', 'line', 'text', 'g', 'polygon', 'polyline', 'defs', 'linearGradient', 'stop', 'filter']
    });
  } catch (e) {
    answerEl.textContent = raw;
    return;
  }
  answerEl.innerHTML = cleanHtml;

  // ---- 5. 初始化 ECharts（从 answerEl 查询真实 DOM，不要用 tmp 中已失效的 holder 引用） ----
  const realChartDivs = answerEl.querySelectorAll('.chart-container');
  if (!window.echarts || !realChartDivs.length) return;
  realChartDivs.forEach(div => {
    let cfg;
    try { cfg = JSON.parse(div.dataset.chartCfg || ''); } catch (e) { cfg = null; }
    if (!cfg) return;
    // 防重复 init
    const exist = window.echarts.getInstanceByDom(div);
    if (exist) { try { exist.dispose(); } catch (e) {} }
    let inst;
    try { inst = window.echarts.init(div); } catch (e) { return; }
    _chartInstances.add(inst);
    const option = buildEChartsOption(cfg);
    try { inst.setOption(option); } catch (e) {}
  });
}

/** 按 build_chart 标准 JSON 映射到 ECharts option */
function buildEChartsOption(cfg) {
  const type = cfg.type || 'line';
  const title = cfg.title || '';
  const xAxis = Array.isArray(cfg.xAxis) ? cfg.xAxis : [];
  const series = Array.isArray(cfg.series) ? cfg.series : [];
  const yAxisName = cfg.yAxisName || '';

  if (type === 'pie') {
    const data = [];
    const s0 = series[0] && Array.isArray(series[0].data) ? series[0].data : [];
    for (let i = 0; i < xAxis.length && i < s0.length; i++) {
      data.push({ name: String(xAxis[i]), value: Number(s0[i]) });
    }
    return {
      title: { text: title, left: 'center', textStyle: { fontSize: 14 } },
      tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
      legend: { bottom: 0, type: 'scroll' },
      series: [{ type: 'pie', radius: ['35%', '65%'], center: ['50%', '48%'], data: data, label: { formatter: '{b}\n{d}%' } }]
    };
  }

  // line / bar
  return {
    title: { text: title, left: 'center', textStyle: { fontSize: 14 } },
    tooltip: { trigger: 'axis' },
    legend: { bottom: 0, type: 'scroll' },
    grid: { left: 50, right: 24, top: 48, bottom: 40 },
    xAxis: { type: 'category', data: xAxis, axisLabel: { interval: 0, rotate: xAxis.length > 6 ? 30 : 0 } },
    yAxis: { type: 'value', name: yAxisName, nameTextStyle: { color: '#6b7280' } },
    series: series.map(s => ({
      name: s.name || '',
      type: type,
      data: Array.isArray(s.data) ? s.data.map(v => Number(v)) : [],
      smooth: type === 'line',
      barMaxWidth: 40
    }))
  };
}

// ---------- 聊天音效（Web Audio 合成，无外部资源） ----------
// 发送时「叮」、回答完毕（聊天终止）时「叮—当」，让用户感知回答开始与结束
let _actx = null;
function getCtx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}
// 合成一次"叮/当"：一个正弦音 + 指数衰减包络（清脆收尾）
function playTone(freq, dur, delay) {
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
// 发送音：高音短促（叮）
const playSendSound = () => playTone(880, 0.18);
// 完成音：低高双音（叮—当）
const playDoneSound = () => { playTone(660, 0.35); playTone(880, 0.28, 0.12); };

const SS_KEY = 'agent-chat-session';

fetch('/api/app').then(r => r.json()).then(j => {

// 会话控制（header 渲染 + 登录校验 + 管理菜单显隐）由 common.js 提供
CF.renderHeader();

/** 已完成回答的 usage 行右侧挂「存为评测样本」按钮：跳转 /eval 预填新增样本表单 */

// ---------- 技能快捷插入 ----------
// 技能清单来自所选智能体已装配的技能仓库（/api/agent/skills?agentId=），
// 悬停 chip 显示 description，点击在光标处插入 /技能名

/** 拉取当前智能体的技能清单并重渲染；转换/删除 skill 或切换智能体后调用，保证输入区 chip 与实际一致 */
function loadSkills() {
  fetch('/api/agent/skills' + agentQuery()).then(r => r.json()).then(j => {
    if (j && j.code === 0) renderSkills(j.data && j.data.skills);
  }).catch(() => { /* 拉取失败时整行隐藏，不影响聊天 */ });
}

function renderSkills(skills) {
  const row = $('skills-row');
  if (!row) return;
  // 重复调用先清掉旧技能 chip（子Agent 汇总 chip 带 sub-chip 标记，保留）
  row.querySelectorAll('.skill-chip:not(.sub-chip)').forEach(n => n.remove());
  if (!skills || !skills.length) {
    if (!row.querySelector('.skill-chip')) row.classList.remove('show'); // 无技能且无子Agent 时整行隐藏
    return;
  }
  for (const s of skills) {
    const chip = document.createElement('span');
    chip.className = 'skill-chip';
    chip.textContent = '🛠 ' + s.name;
    const tip = document.createElement('span');
    tip.className = 'tip';
    tip.textContent = s.description || '（无介绍）';
    chip.appendChild(tip);
    chip.addEventListener('click', () => insertSkill(s.name));
    row.appendChild(chip);
  }
  row.classList.add('show');
}

/** 在光标处插入 /技能名（输入框已含同一标记时不重复插入），插入后聚焦输入框 */
function insertSkill(name) {
  const tag = '/' + name + ' ';
  if (inputEl.value.includes(tag.trim())) { inputEl.focus(); return; }
  const pos = inputEl.selectionStart == null ? inputEl.value.length : inputEl.selectionStart;
  inputEl.value = inputEl.value.slice(0, pos) + tag + inputEl.value.slice(pos);
  inputEl.selectionStart = inputEl.selectionEnd = pos + tag.length;
  inputEl.focus();
  autoGrow();
}

// ---------- 子 Agent 数量（并入技能行） ----------
// 数量来自所选智能体 SubagentManager 注册表（/api/agent/subagents?agentId=），纯展示不实例化；
// 仅当存在子 agent 时渲染（>0），避免出现「子Agent 0」噪音

/** 拉取当前智能体的子 Agent 清单并重渲染 chip（切换智能体后调用） */
function loadSubagents() {
  fetch('/api/agent/subagents' + agentQuery()).then(r => r.json()).then(j => {
    if (j && j.code === 0) renderSubagents(j.data && j.data.subagents);
  }).catch(() => { /* 拉取失败不显示，不影响聊天 */ });
}

function renderSubagents(subagents) {
  const row = $('skills-row');
  if (!row) return;
  row.querySelectorAll('.skill-chip.sub-chip').forEach(n => n.remove()); // 先清旧 chip（切换智能体重渲染）
  if (!Array.isArray(subagents) || !subagents.length) {
    if (!row.querySelector('.skill-chip')) row.classList.remove('show'); // 技能也为空时整行隐藏
    return;
  }
  const chip = document.createElement('span');
  chip.className = 'skill-chip sub-chip'; // sub-chip 标记：技能 chip 刷新时保留
  chip.textContent = '🤖 子Agent ' + subagents.length;
  const tip = document.createElement('span');
  tip.className = 'tip';
  tip.textContent = subagents.map(s => s.agentId).join('、');
  chip.appendChild(tip);
  row.appendChild(chip);
  if (!row.classList.contains('show')) row.classList.add('show');
}

/** 重拉当前智能体的技能/工具/子 Agent 三清单（初始化与切换智能体时调用，与选择器对应） */
function refreshCapabilities() {
  loadSkills();
  loadTools();
  loadSubagents();
}

// ---------- 工具清单拉取 ----------
// 数据来自所选智能体 Toolkit 实时存活集（GET /api/agent/tools?agentId=），缓存到 toolCache，
// 供输入框 "/" 快捷菜单过滤使用
let toolCache = [];

/** 拉取当前智能体的工具清单并刷新缓存（切换智能体后调用，"/" 菜单随之更新） */
function loadTools() {
  fetch('/api/agent/tools' + agentQuery()).then(r => r.json()).then(j => {
    if (j && j.code === 0 && j.data && j.data.agentAvailable) {
      toolCache = j.data.tools || [];
    }
  }).catch(() => { /* 拉取失败保持空列表 */ });
}

// ---------- “/” 工具快捷菜单 ----------
// 输入框中键入 / （或 /前缀）时在输入框上方弹出工具清单，点击或 Enter 选中后
// 将 /工具名 写回光标处；数据来自 toolCache
const slashMenu = $('slash-menu');
let slashItems = [];   // 当前过滤后的候选工具
let slashActive = 0;   // 当前高亮项索引
let slashStart = -1;   // 触发 "/" 标记在输入框中的起始下标
const slashOpen = () => slashMenu.style.display === 'block';

/** 取光标前正在输入的 "/xxx" 标记（须前邻空格或行首），无则返回 null */
function currentSlashToken() {
  const pos = inputEl.selectionStart;
  if (pos == null) return null;
  const m = inputEl.value.slice(0, pos).match(/(?:^|\s)(\/[A-Za-z0-9_-]*)$/);
  return m ? { start: pos - m[1].length, token: m[1] } : null;
}

function hideSlashMenu() {
  slashMenu.style.display = 'none';
  slashMenu.innerHTML = '';
  slashItems = [];
  slashActive = 0;
  slashStart = -1;
}

function showSlashMenu() {
  const cur = currentSlashToken();
  if (!cur || !toolCache.length) { hideSlashMenu(); return; }
  const kw = cur.token.slice(1).toLowerCase();
  const list = kw ? toolCache.filter(t => (t.name || '').toLowerCase().includes(kw)) : toolCache;
  if (!list.length) { hideSlashMenu(); return; }
  slashItems = list;
  slashStart = cur.start;
  slashActive = 0;
  renderSlashMenu();
  slashMenu.style.display = 'block';
}

function renderSlashMenu() {
  slashMenu.innerHTML = '';
  slashItems.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 's-item' + (i === slashActive ? ' active' : '');
    const name = document.createElement('div');
    name.className = 's-name';
    name.textContent = '/' + t.name;
    const desc = document.createElement('div');
    desc.className = 's-desc';
    desc.textContent = t.description || '（无说明）';
    if(t.type){
      desc.textContent =  '(' + t.type + ')' + ' ' + desc.textContent;
    }
    item.appendChild(name);
    item.appendChild(desc);
    // mousedown 阻止默认，避免点击瞬间失焦导致菜单先被 blur 收起；
    // 兼容仅派发 click 事件的场景（脚本点击/触屏）：mousedown 选中后 slashItems 已清空，不会重复写入
    item.addEventListener('mousedown', e => { e.preventDefault(); pickSlashTool(i); });
    item.addEventListener('click', () => pickSlashTool(i));
    // 鼠标悬停仅切换高亮，不重建 DOM（整菜单重渲染会替换鼠标下方的节点，导致点击落空）
    item.addEventListener('mousemove', () => setActiveItem(i));
    slashMenu.appendChild(item);
  });
}

/** 切换高亮到第 i 项（仅更新 class，不动 DOM 结构） */
function setActiveItem(i) {
  if (i === slashActive) return;
  slashActive = i;
  const items = slashMenu.children;
  for (let k = 0; k < items.length; k++) items[k].classList.toggle('active', k === i);
}

/** 选中第 i 个候选：用 "/工具名 " 替换光标前的 "/xxx" 标记 */
function pickSlashTool(i) {
  const t = slashItems[i];
  if (!t) return;
  const pos = inputEl.selectionStart;
  inputEl.value = inputEl.value.slice(0, slashStart) + '/' + t.name + ' ' + inputEl.value.slice(pos);
  const c = slashStart + t.name.length + 2;
  inputEl.selectionStart = inputEl.selectionEnd = c;
  hideSlashMenu();
  inputEl.focus();
  autoGrow();
}

// ---------- 用户提示词（# 快捷菜单 + 管理弹窗） ----------
// 提示词按登录用户隔离（后端 data/prompts/{userId}.json），进入页面拉取缓存，
// 管理弹窗保存/删除后重新拉取，供 "#" 菜单过滤使用
let promptCache = [];

function loadPrompts() {
  fetch('/api/prompts').then(r => r.json()).then(j => {
    if (j && j.code === 0) promptCache = (j.data && j.data.prompts) || [];
  }).catch(() => { /* 拉取失败保持空列表，不影响聊天 */ });
}

// ---------- “#” 提示词快捷菜单 ----------
// 与 "/" 工具菜单同构：光标前为 "#xxx"（须前邻空格或行首）时弹出当前用户提示词，
// 点击或 Enter 选中后将 # 标记整体替换为提示词全文
const promptMenu = $('prompt-menu');
let pmItems = [];    // 当前过滤后的候选提示词
let pmActive = 0;    // 当前高亮项索引
let pmStart = -1;    // 触发 "#" 标记在输入框中的起始下标
const promptOpen = () => promptMenu.style.display === 'block';

/** 取光标前正在输入的 "#xxx" 标记（须前邻空格或行首），无则返回 null */
function currentHashToken() {
  const pos = inputEl.selectionStart;
  if (pos == null) return null;
  const m = inputEl.value.slice(0, pos).match(/(?:^|\s)(#[^\s]*)$/);
  return m ? { start: pos - m[1].length, token: m[1] } : null;
}

function hidePromptMenu() {
  promptMenu.style.display = 'none';
  promptMenu.innerHTML = '';
  pmItems = [];
  pmActive = 0;
  pmStart = -1;
}

function showPromptMenu() {
  const cur = currentHashToken();
  if (!cur || !promptCache.length) { hidePromptMenu(); return; }
  const kw = cur.token.slice(1).toLowerCase();
  const list = kw ? promptCache.filter(p =>
      (p.title || '').toLowerCase().includes(kw) || (p.content || '').toLowerCase().includes(kw)) : promptCache;
  if (!list.length) { hidePromptMenu(); return; }
  pmItems = list;
  pmStart = cur.start;
  pmActive = 0;
  renderPromptMenu();
  promptMenu.style.display = 'block';
}

/** 内容首行摘要（空白折叠，截断 40 字） */
function pmSummary(text) {
  const s = String(text == null ? '' : text).replace(/\s+/g, ' ').trim();
  return s.length > 40 ? s.slice(0, 40) + '…' : (s || '（无内容）');
}

function renderPromptMenu() {
  promptMenu.innerHTML = '';
  pmItems.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 's-item' + (i === pmActive ? ' active' : '');
    const name = document.createElement('div');
    name.className = 's-name';
    name.textContent = '# ' + (p.title || '');
    const desc = document.createElement('div');
    desc.className = 's-desc';
    desc.textContent = pmSummary(p.content);
    item.appendChild(name);
    item.appendChild(desc);
    // mousedown 阻止默认避免点击瞬间失焦先收起菜单（与 "/" 菜单一致）
    item.addEventListener('mousedown', e => { e.preventDefault(); pickPrompt(i); });
    item.addEventListener('click', () => pickPrompt(i));
    item.addEventListener('mousemove', () => setPromptActive(i));
    promptMenu.appendChild(item);
  });
}

/** 切换高亮到第 i 项（仅更新 class，不动 DOM 结构） */
function setPromptActive(i) {
  if (i === pmActive) return;
  pmActive = i;
  const items = promptMenu.children;
  for (let k = 0; k < items.length; k++) items[k].classList.toggle('active', k === i);
}

/** 选中第 i 个候选：用提示词全文替换光标前的 "#xxx" 标记 */
function pickPrompt(i) {
  const p = pmItems[i];
  if (!p) return;
  const pos = inputEl.selectionStart;
  const val = p.content || '';
  inputEl.value = inputEl.value.slice(0, pmStart) + val + inputEl.value.slice(pos);
  const c = pmStart + val.length;
  inputEl.selectionStart = inputEl.selectionEnd = c;
  hidePromptMenu();
  inputEl.focus();
  autoGrow();
}

    box.innerHTML = '<div class="pf-empty">加载失败：' + esc(e.message || '网络异常') + '</div>';

    return;
  }
  const tbl = document.createElement('table');

    for (const sn of (p.skillNames || [])) {

      tag.addEventListener('click', () => deletePsSkill(sn));
      tdTitle.appendChild(document.createElement('br'));
      tdTitle.appendChild(tag);
    }
    const tdContent = document.createElement('td');
    tdContent.className = 'p-content';
    tdContent.textContent = p.content || '';
    tdContent.title = p.content || '';
    const tdTime = document.createElement('td');
    tdTime.className = 'muted';
    tdTime.textContent = p.updatedAt || '';
    const tdOp = document.createElement('td');
    const edit = document.createElement('span');
    edit.className = 'p-op';
    edit.textContent = '编辑';
    edit.addEventListener('click', () => openPmForm(p));
    const toSkill = document.createElement('span');
    toSkill.className = 'p-op skill';
    toSkill.textContent = '转 Skill';
    toSkill.title = '沉淀为 skill（项目 skills 目录，新会话即生效）';
    toSkill.addEventListener('click', () => openPsForm(p));
    const del = document.createElement('span');
    del.className = 'p-op del';
    del.textContent = '删除';
    del.addEventListener('click', () => deletePm(p));
    tdOp.appendChild(edit);
    tdOp.appendChild(toSkill);
    tdOp.appendChild(del);
    tr.appendChild(tdTitle);
    tr.appendChild(tdContent);

const AGENT_KEY = 'agent-chat-agent'; // localStorage：当前选中的自建智能体 id（空 = 平台主智能体）

/** 拉取上架智能体并填充选择器；无上架项时保持隐藏，localStorage 里的失效选择同时清除 */
async function loadChatAgents() {
  try {
    const res = await fetch('/api/agents/for-chat');
    const j = await res.json();
    chatAgents = (res.ok && j && j.code === 0 && j.data) || [];
  } catch (e) {
    chatAgents = [];
  }
  const sel = $('agent-sel');
  if (!sel) return;
  if (!chatAgents.length) {
    localStorage.removeItem(AGENT_KEY);
    return;
  }
  sel.innerHTML = '<option value="">平台智能体</option>' +
      chatAgents.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  const saved = currentAgentId();
  if (saved && chatAgents.some(a => a.id === saved)) sel.value = saved;
  else { sel.value = ''; localStorage.removeItem(AGENT_KEY); }
  sel.style.display = '';
  sel.addEventListener('change', onAgentSwitch);

  const sel = $('agent-sel');
  if (sel.value) localStorage.setItem(AGENT_KEY, sel.value);

    startTime: new Date(),
    isDone: false,
    setDone(usage, ts) {

      this.caret.style.display = 'none';
      // 完成态首次置位：执行 Markdown + 图表渲染（之后禁止再改 textContent）
      try { renderAnswerContent(this.answer); } catch (e) {}
      const timeStr = fmtTime(ts || this.startTime);

      if (!timeStr && !hasUsage && !isAdminUser) return;
      const u = document.createElement('div');

        text = text ? text + ' · ' + tok : tok;
      }

      this.root.appendChild(u);
      addEvalBtn(this.root); // 「存为评测样本」挂 usage 行右侧（非 ADMIN 自动跳过）
    },
    setError(msg) {
      this.caret.style.display = 'none';
      const e = document.createElement('div');
      e.className = 'err-text';
      e.textContent = '出错了：' + msg;
      this.root.appendChild(e);
    }
  };
}

// ---------- 轮次刻度导航（Turn Rail）：消息区左侧刻度轨，每条用户消息一个刻度横线，点击跳转到该条消息 ----------
const railEl = $('turn-rail');
const railVpEl = $('turn-vp');
const turnPosEl = $('turn-pos');
const RAIL_PAD = 20;   // 刻度映射区上下留白（与 .turn-rail::before 轨道线的 top/bottom 一致）
const TICK_GAP = 12;   // 相邻刻度最小间距，长会话防重叠
let railUsers = [];    // 重排时捕获的 .msg-user 列表（点击跳转与当前刻度判定走缓存，滚动路径零查询）
let railTops = [];     // 与 railUsers 对齐：各消息顶边相对内容顶的距离（messages 未定位，不能用 offsetTop）
let railTicks = [];    // 与 railUsers 对齐的刻度按钮缓存
let railH = 0;         // 刻度轨高度缓存
let railContentH = 1;  // 消息内容总高缓存
let railTimer = null;  // 重排节流定时器

/** 刻度悬停预览：取用户消息首个非空文本节点前 20 字（跳过 flat-tag 角标与 to-prompt 按钮） */
function railPreview(el) {
  for (const n of el.childNodes) {
    if (n.nodeType === 3 && n.textContent.trim()) return n.textContent.trim().replace(/\s+/g, ' ').slice(0, 20);
  }
  return '';
}

/** 节流重排：流式追加文本会高频触发 mutation，以 200ms 周期批量收敛 */
function scheduleRailLayout() {
  if (railTimer) return;
  railTimer = setTimeout(relayoutRail, 200);
}

/** 全量重排：重建刻度（数量 = 用户消息数，2 条及以上才显示轨道，单条无定位意义）、位置按内容分布等比映射、相邻不足时顺序下压、过密降级等距 */
function relayoutRail() {
  railTimer = null;
  railUsers = Array.from(messagesEl.querySelectorAll('.msg-user'));
  railEl.classList.toggle('show', railUsers.length > 1);
  railTops = [];
  railTicks = [];
  turnPosEl.textContent = '';
  railVpEl.style.display = 'none';
  if (railUsers.length < 2) return;
  railH = railEl.clientHeight;
  if (!railH) return;
  railContentH = messagesEl.scrollHeight || 1;
  const usable = railH - RAIL_PAD * 2;
  const baseTop = messagesEl.getBoundingClientRect().top;
  railUsers.forEach((el, i) => {
    railTops[i] = el.getBoundingClientRect().top - baseTop + messagesEl.scrollTop;
  });
  // 纵坐标：内容比例映射；相邻不足 TICK_GAP 时顺序下压；刻度数超出轨道容量时降级等距（保序保可点）
  let ys;
  if (railUsers.length > Math.floor(usable / TICK_GAP) + 1) {
    const step = railUsers.length > 1 ? usable / (railUsers.length - 1) : 0;
    ys = railUsers.map((_, i) => RAIL_PAD + i * step);
  } else {
    ys = [];
    let prev = -Infinity;
    for (const top of railTops) {
      let y = RAIL_PAD + (top / railContentH) * usable;
      if (y < prev + TICK_GAP) y = prev + TICK_GAP;
      y = Math.min(y, railH - RAIL_PAD);
      prev = y;
      ys.push(y);
    }
  }
  railEl.querySelectorAll('.turn-tick').forEach(t => t.remove());
  const frag = document.createDocumentFragment();
  ys.forEach((y, i) => {
    const btn = document.createElement('button');
    btn.className = 'turn-tick';
    btn.style.top = y + 'px';
    btn.dataset.idx = String(i);
    btn.setAttribute('aria-label', '跳到第 ' + (i + 1) + ' 条消息');
    const bar = document.createElement('span');
    bar.className = 'bar';
    const tip = document.createElement('span');
    tip.className = 'tip';
    const label = document.createElement('b');
    label.textContent = '第 ' + (i + 1) + ' 条' + (railUsers[i].querySelector('.flat-tag') ? '（压缩前）' : '');
    tip.appendChild(label);
    tip.appendChild(document.createTextNode(railPreview(railUsers[i])));
    btn.appendChild(bar);
    btn.appendChild(tip);
    frag.appendChild(btn);
  });
  railEl.appendChild(frag);
  railTicks = Array.from(railEl.querySelectorAll('.turn-tick'));
  syncRail();
}

/** 滚动联动（轻量）：只更新视口块/当前刻度高亮/头部计数，全部走缓存；单条消息无轨道，同样短路；内容高度变化时顺手预约重排（图片加载等场景） */
function syncRail() {
  if (railUsers.length < 2 || !railH) return;
  if (messagesEl.scrollHeight !== railContentH) scheduleRailLayout();
  const usable = railH - RAIL_PAD * 2;
  railVpEl.style.display = '';
  railVpEl.style.top = (RAIL_PAD + (messagesEl.scrollTop / railContentH) * usable) + 'px';
  railVpEl.style.height = Math.max(16, (messagesEl.clientHeight / railContentH) * usable) + 'px';
  const probe = messagesEl.scrollTop + 30;
  let active = 0;
  for (let i = 0; i < railTops.length; i++) if (railTops[i] <= probe) active = i;
  for (let i = 0; i < railTicks.length; i++) railTicks[i].classList.toggle('active', i === active);
  turnPosEl.textContent = '第 ' + (active + 1) + ' / ' + railUsers.length + ' 条';
}

// 点击刻度：跳到对应用户消息（顶部留 10px），蓝色光环渐隐提示落点
railEl.addEventListener('click', e => {
  const tick = e.target.closest('.turn-tick');
  if (!tick) return;
  const i = Number(tick.dataset.idx);
  const el = railUsers[i];
  if (!el) return;
  messagesEl.scrollTo({ top: Math.max(0, railTops[i] - 10), behavior: 'smooth' });
  el.classList.remove('flash');
  void el.offsetWidth; // 强制回流以重启动画
  el.classList.add('flash');
});
// 触发源统一收敛到节流重排：新消息/流式追加/历史恢复/思考与执行过程展开收起均改变消息区子树
new MutationObserver(scheduleRailLayout).observe(messagesEl, {
  childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['open']
});
messagesEl.addEventListener('scroll', () => requestAnimationFrame(syncRail), { passive: true });
window.addEventListener('resize', scheduleRailLayout);
relayoutRail(); // 首次排版（后续新消息与会话恢复由 MutationObserver 接管）

// ---------- SSE 解析 ----------
/** 轮次块懒创建：round start 已建则复用；兼容未发 round 事件的旧流（首个内容事件时兜底创建） */
function ensureRound(st) {
  if (!st.ui) {
    st.ui = addAgentMsg();
    sessionTotals.lastUi = st.ui;
  }
  return st.ui;
}

function handleSseBlock(block, st) {
  let eventName = 'message';
  const dataLines = [];
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) eventName = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  }
  if (!dataLines.length) return; // 心跳注释或空块
  let payload = {};
  try { payload = JSON.parse(dataLines.join('\n')); } catch (e) { payload = { delta: dataLines.join('\n') }; }

  if (eventName === 'session') {
    sessionId = payload.sessionId || sessionId;
    localStorage.setItem(SS_KEY, sessionId);
  } else if (eventName === 'round') {
    // 轮次边界：ReAct 每轮模型调用一对 start/end；每轮独立气泡，与历史渲染一致
    if (payload.phase === 'start') {
      st.ui = addAgentMsg();
      sessionTotals.lastUi = st.ui;
    } else if (payload.phase === 'end' && st.ui) {
      st.ui.setDone({ promptTokens: payload.promptTokens, completionTokens: payload.completionTokens });
      sessionTotals.in += payload.promptTokens || 0;
      sessionTotals.out += payload.completionTokens || 0;
      scrollBottom();
    }
  } else if (eventName === 'thinking') {
    const ui = ensureRound(st);
    ui.thinkBox.style.display = '';
    ui.thinkInner.textContent += (payload.delta || '');
    ui.thinkBox.open = true;
    scrollBottom();
  } else if (eventName === 'tool') {
    const ui = ensureRound(st);
    ui.toolBox.style.display = '';
    ui.toolBox.open = true;
    const entry = (payload.id && ui.toolLines && ui.toolLines[payload.id]) || null;
    if (payload.phase === 'start') {
      const line = document.createElement('div');
      line.className = 'tool-line';
      line.innerHTML = '▶ 调用 <span class="tname">' + esc(payload.name) + '</span>';
      const args = document.createElement('div');
      args.className = 'targs';
      args.style.display = 'none';
      line.appendChild(args);
      ui.toolInner.appendChild(line);
      if (payload.id) {
        ui.toolLines = ui.toolLines || {};
        ui.toolLines[payload.id] = { line, args };
      }
      ui.lastToolEntry = { line, args };
    } else if (payload.phase === 'args') {
      const e = entry || ui.lastToolEntry;
      if (e && payload.delta) {
        e.args.style.display = '';
        e.args.textContent += payload.delta;
      }
    } else if (payload.phase === 'end') {
      const e = entry || ui.lastToolEntry;
      if (e) {
        e.line.classList.add('end');
        e.line.innerHTML = '✓ <span class="tname">' + esc(payload.name || '') + '</span>';
        e.line.appendChild(e.args);
      } else {
        const line = document.createElement('div');
        line.className = 'tool-line end';
        line.innerHTML = '✓ <span class="tname">' + esc(payload.name) + '</span>';
        ui.toolInner.appendChild(line);
      }
    } else if (payload.phase === 'result-start') {
      const e = entry || ui.lastToolEntry;
      if (e && !e.out) {
        const out = document.createElement('div');
        out.className = 'toutput';
        out.style.display = 'none';
        e.line.appendChild(out);
        e.out = out;
      }
    } else if (payload.phase === 'result-delta') {
      const e = entry || ui.lastToolEntry;
      if (e && payload.delta) {
        if (!e.out) {
          const out = document.createElement('div');
          out.className = 'toutput';
          e.line.appendChild(out);
          e.out = out;
        }
        e.out.style.display = '';
        e.out.textContent += payload.delta;
      }
    } else if (payload.phase === 'result-end') {
      const e = entry || ui.lastToolEntry;
      if (e && payload.state === 'ERROR' && e.out) {
        e.out.classList.add('err');
      }
    }
    scrollBottom();
  } else if (eventName === 'limit') {
    // 思考轮次达 maxIters 上限：随后为不带工具的强制收尾轮；done 后展示「继续执行任务」入口
    st.hitLimit = true;
    st.maxIters = payload.maxIters;
  } else if (eventName === 'answer') {
    const ui = ensureRound(st);
    ui.answer.textContent += (payload.delta || '');
    ui.caret.style.display = '';
    scrollBottom();
  } else if (eventName === 'done') {
    // 各轮 tokens 已在 round end 落位（done 的 usage 为全轮聚合，不再重复累计）；
    // 这里只对末块兜底（未收到 round end 时补时间行）并刷新总计行
    if (st.ui) st.ui.setDone(null);
    appendLimitNotice(st); // 收到过 limit 则展示续跑入口（函数内幂等）
    appendTotalUsage();
  } else if (eventName === 'error') {
    ensureRound(st).setError(payload.message || '未知错误');
  }
}

/**
 * maxIters 超限提示条：done/流结束时渲染一次（函数内幂等；新条目顶替旧条目）。
 * 点击「继续执行任务」复用完整发送管线续跑：新一轮 ReAct 轮次预算重新计满，
 * 模型基于会话历史重新发起被收尾轮吞掉的工具调用。
 */
function appendLimitNotice(st) {
  if (!st.hitLimit || st.limitShown) return;
  st.limitShown = true;
  document.querySelectorAll('.limit-notice').forEach(el => el.remove()); // 旧提示条顶替，避免堆积
  const box = document.createElement('div');
  box.className = 'limit-notice';
  const txt = document.createElement('span');
  txt.textContent = '思考次数已达上限' + (st.maxIters ? '（' + st.maxIters + ' 轮）' : '') + '，任务可能未完成';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'limit-continue';
  btn.textContent = '继续执行任务';
  btn.addEventListener('click', () => {
    box.remove();
    inputEl.value = '继续执行任务';
    send();
  });
  box.appendChild(txt);
  box.appendChild(btn);
  messagesEl.appendChild(box);
  scrollBottom();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  streaming = true;
  btnSend.disabled = true;
  btnStop.style.display = '';
  inputEl.value = '';
  hideSlashMenu(); // JS 清空不触发 input 事件，菜单需手动收起
  hidePromptMenu();
  autoGrow();

  addUserMsg(text);
  playSendSound(); // 发送即响「叮」，提示回答已开始
  const st = { ui: null, hitLimit: false, limitShown: false, maxIters: 0 }; // 轮次块（round start 创建，一轮一气泡）+ 超限标记（limit 事件置位）
  aborter = new AbortController();

  try {
    const res = await fetch('/api/agent/sessions/' + encodeURIComponent(sessionId) + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, agentId: currentAgentId() || null }),
      signal: aborter.signal
    });
    if (!res.ok || !res.body) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.message || j.msg || msg; } catch (e) {}
      if (res.status === 401) { location.href = '/login'; return; }
      ensureRound(st).setError(msg);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (block.trim()) handleSseBlock(block, st);
      }
    }
    if (buf.trim()) handleSseBlock(buf, st);
    if (st.ui) st.ui.setDone(null); // 流结束兜底（round end 已处理则幂等）
    appendLimitNotice(st); // 已收到 limit 而 done 缺失时的兜底（函数内幂等）
    if (stopRequested && st.ui) {
      const s = document.createElement('span');
      s.className = 'stopped-tag';
      s.textContent = '\n\n（已停止）';
      st.ui.answer.appendChild(s);
    }
    stopRequested = false;
  } catch (e) {
    if (e.name === 'AbortError') {
      if (st.ui) {
        if (!st.ui.isDone) st.ui.setDone(null);
        const s = document.createElement('span');
        s.className = 'stopped-tag';
        s.textContent = '\n\n（已停止）';
        st.ui.answer.appendChild(s);
      }
    } else {
      ensureRound(st).setError(e.message || '网络异常');
    }
  } finally {
    streaming = false;
    aborter = null;
    btnSend.disabled = false;
    btnStop.style.display = 'none';
    inputEl.focus();
    loadSessions(); // 本轮落盘后刷新列表（标题/时间/排序）
    playDoneSound(); // 聊天终止（正常/出错/停止）统一响「叮—当」
  }
}

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

// ---------- 历史会话 ----------
let sessions = [];
// 双击重命名检测状态（模块级：单击切换会话重建列表 DOM 后仍保持，见 renderSessions 内说明）
let lastClick = { id: null, ts: 0 };

async function loadSessions() {
  try {
    const res = await fetch('/api/agent/sessions' + agentQuery());
    if (res.status === 401) { location.href = '/login'; return; }
    const j = await res.json();
    sessions = (j && j.data && j.data.sessions) || [];
  } catch (e) {
    sessions = [];
  }
  renderSessions();
}

/** 当前搜索关键词（去空白转小写）；空串 = 未过滤 */
function searchKw() {
  const el = $('sess-search');
  return el ? el.value.trim().toLowerCase() : '';
}

function renderSessions() {
  const list = $('sess-list');
  list.innerHTML = '';
  const kw = searchKw();
  // 当前会话尚未在后端落盘（刚点【新会话】或恢复到已失效 id）→ 顶部显示占位项并高亮，
  // 首条消息落盘后占位项自动被真实会话条目替代；搜索态隐藏占位项避免干扰匹配
  if (!kw && !sessions.some(s => s.sessionId === sessionId)) {
    const ph = document.createElement('div');
    ph.className = 'sess-item active';
    ph.title = '新会话';
    const t = document.createElement('div');
    t.className = 'sess-title';
    t.textContent = '(新会话)';
    ph.appendChild(t);
    list.appendChild(ph);
  }
  let shown = 0;
  for (const s of sessions) {
    if (kw && !(s.title || '').toLowerCase().includes(kw)) continue; // 按标题即时过滤
    shown++;
    const item = document.createElement('div');
    item.className = 'sess-item' + (s.sessionId === sessionId ? ' active' : '');
    const title = document.createElement('div');
    title.className = 'sess-title';
    title.textContent = s.title || '(空会话)';
    const time = document.createElement('div');
    time.className = 'sess-time';
    time.textContent = relTime(s.updateTime);
    item.appendChild(title);
    item.appendChild(time);
    // 双击进入重命名：自实现 400ms 双击检测。首次单击切换会话会重建列表 DOM，
    // 原生 dblclick 的两击落在不同节点上不触发；模块级 lastClick 跨重建仍有效
    item.addEventListener('click', () => {
      const now = Date.now();
      if (lastClick.id === s.sessionId && now - lastClick.ts < 400) {
        lastClick = { id: null, ts: 0 };
        beginRename(title, s);
        return; // 第二击进编辑态；首击已完成切换
      }
      lastClick = { id: s.sessionId, ts: now };
      switchSession(s.sessionId);
    });
    const del = document.createElement('span');
    del.className = 'sess-del';
    del.textContent = '✕';
    del.title = '删除会话';
    del.addEventListener('click', e => { e.stopPropagation(); deleteSession(s.sessionId); });
    item.appendChild(del);
    list.appendChild(item);
  }
  if (kw && !shown) {
    const empty = document.createElement('div');
    empty.className = 'sess-empty';
    empty.textContent = '无匹配会话';
    list.appendChild(empty);
  }
  updateChatHead();
}

/** 双击标题进入内联重命名：Enter/失焦保存，Escape 取消，空值视为取消 */
function beginRename(titleEl, s) {
  if (titleEl.querySelector('input.rename')) return;
  const input = document.createElement('input');
  input.className = 'rename';
  input.maxLength = 50; // 与后端 SessionTitleState.TITLE_MAX 对齐
  input.value = s.title || '';
  titleEl.textContent = '';
  titleEl.appendChild(input);
  input.focus();
  input.select();
  let done = false; // Enter 触发后 blur 仍会到达，只收尾一次
  const finish = save => {
    if (done) return;
    done = true;
    const val = input.value.trim();
    if (save && val && val !== s.title) saveRename(s, val);
    else renderSessions(); // 取消/空值/未变化：恢复原标题
  };
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
}

/** 保存重命名：PUT title；成功更新本地缓存后重渲染（当前会话头部随 updateChatHead 联动），失败弹错恢复 */
async function saveRename(s, title) {
  try {
    const res = await fetch('/api/agent/sessions/' + encodeURIComponent(s.sessionId) + '/title' + agentQuery(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    if (res.status === 401) { location.href = '/login'; return; }
    const j = await res.json();
    if (!res.ok || j.code !== 0) throw new Error((j && j.msg) || ('HTTP ' + res.status));
    s.title = title;
  } catch (e) {
    alert('重命名失败：' + (e.message || '网络异常'));
  }
  renderSessions();
}

/** 头部当前会话标题：落盘会话取列表标题，未落盘显示“新会话” */
function updateChatHead() {
  const el = $('chat-title');
  if (!el) return;
  const cur = sessions.find(s => s.sessionId === sessionId);
  el.textContent = cur ? (cur.title || '(空会话)') : '新会话';
  el.title = el.textContent;
}

/** 开启新会话：换新 id、清空消息区（自建智能体有开场白时渲染为首条气泡）、刷新列表（新会话按钮/智能体切换/恢复横幅共用） */
function startNewSession() {
  if (streaming && aborter) aborter.abort();
  disposeAllCharts();
  newSessionId();
  if (!showGreeting(currentAgentId())) messagesEl.innerHTML = emptyTipHtml('已开启新会话');
  renderSessions();
  inputEl.focus();
}

/** 页面加载恢复到旧会话时，消息区顶部显示醒目横幅：继续旧对话 or 一键开新会话 */
function showResumeTip(title) {
  if ($('resume-tip')) return;
  const tip = document.createElement('div');
  tip.className = 'resume-tip';
  tip.id = 'resume-tip';
  const span = document.createElement('span');
  span.textContent = '已恢复上次会话「' + (title || '空会话') + '」，继续发送将延续该对话';
  const btn = document.createElement('button');
  btn.className = 'btn ghost';
  btn.textContent = '开启新会话';
  btn.addEventListener('click', startNewSession);
  tip.appendChild(span);
  tip.appendChild(btn);
  messagesEl.insertBefore(tip, messagesEl.firstChild);
}

/** "yyyy-MM-dd HH:mm:ss(.sss)" → 当天显示时分，非当天显示年月日时分 */
function relTime(ts) {
  if (!ts) return '';
  const t = new Date(ts.replace(/(\.\d+)?$/, '').replace(' ', 'T'));
  if (isNaN(t)) return ts;
  const p = n => String(n).padStart(2, '0');
  const hm = p(t.getHours()) + ':' + p(t.getMinutes());
  const now = new Date();
  const sameDay = t.getFullYear() === now.getFullYear() && t.getMonth() === now.getMonth() && t.getDate() === now.getDate();
  return sameDay ? hm : t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + hm;
}

/** 消息时间：当天显示时分秒，非当天显示年月日时分秒；ts 为空返回 '' */
function fmtTime(ts) {
  if (!ts) return '';
  const t = ts instanceof Date ? ts : new Date(String(ts).replace(/(\.\d+)?$/, '').replace(' ', 'T'));
  if (isNaN(t)) return '';
  const p = n => String(n).padStart(2, '0');
  const hms = p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds());
  const now = new Date();
  const sameDay = t.getFullYear() === now.getFullYear() && t.getMonth() === now.getMonth() && t.getDate() === now.getDate();
  return sameDay ? hms : t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + hms;
}

/** 在最后一条 assistant 记录下追加会话累计 token 行（重复调用先移除旧行） */
function appendTotalUsage() {
  document.querySelectorAll('.usage-total').forEach(el => el.remove());
  const st = sessionTotals;
  if (!st.lastUi || !st.lastUi.root.isConnected) return;
  if (st.in === 0 && st.out === 0) return;
  const tot = document.createElement('div');
  tot.className = 'usage usage-total';
  tot.textContent = '总计 tokens: 输入 ' + st.in + ' / 输出 ' + st.out;
  st.lastUi.root.appendChild(tot);
}

async function switchSession(id) {
  if (id === sessionId) return;
  if (streaming && aborter) aborter.abort(); // 切换前终止进行中的回答
  sessionId = id;
  localStorage.setItem(SS_KEY, sessionId);
  renderSessions();
  await loadMessages();
}

async function loadMessages() {
  disposeAllCharts(); // 清空 DOM 前先销毁所有图表实例，防泄漏
  messagesEl.innerHTML = '';
  msgSeq = 0; // 与 /messages 数组下标重新对齐（user/assistant 渲染顺序计数）
  let msgs = null;
  try {
    const res = await fetch('/api/agent/sessions/' + encodeURIComponent(sessionId) + '/messages' + agentQuery());
    if (res.status === 401) { location.href = '/login'; return; }
    const j = await res.json();
    if (res.ok && j.code === 0) msgs = j.data && j.data.messages;
  } catch (e) { /* 网络异常按无记录处理 */ }
  if (!msgs || !msgs.length) {
    if (!showGreeting(currentAgentId())) messagesEl.innerHTML = emptyTipHtml('当前会话暂无记录');
    return;
  }
  sessionTotals = { in: 0, out: 0, lastUi: null };
  for (const m of msgs) {
    if (m.role === 'user') addUserMsg(m.content, m.flat);
    else if (m.role === 'compaction') addCompactionCard(m);
    else {
      const ui = addStaticAgentMsg(m);
      sessionTotals.lastUi = ui;
      sessionTotals.in += m.promptTokens || 0;
      sessionTotals.out += m.completionTokens || 0;
    }
  }
  appendTotalUsage();
  scrollBottom();
}

/** 历史回看：静态渲染 assistant 消息（折叠区默认展开、无光标） */
function addStaticAgentMsg(m) {
  const ui = addAgentMsg();
  if (m.flat) { // 压缩前记录（从会话转录恢复）：附角标提示
    const b = document.createElement('span');
    b.className = 'flat-tag';
    b.title = '压缩前记录：从会话转录恢复，无思考过程与 token 统计';
    b.textContent = '压缩前';
    ui.root.insertBefore(b, ui.root.firstChild);
  }
  if (m.thinking) {
    ui.thinkBox.style.display = '';
    ui.thinkBox.open = true;
    ui.thinkInner.textContent = m.thinking;
  }
  if (m.tools && m.tools.length) {
    ui.toolBox.style.display = '';
    ui.toolBox.open = true;
    for (const t of m.tools) {
      const line = document.createElement('div');
      line.className = 'tool-line end';
      const name = document.createElement('span');
      name.className = 'tname';
      name.textContent = t.name || '';
      line.textContent = '✓ ';
      line.appendChild(name);
      if (t.input) {
        const args = document.createElement('div');
        args.className = 'targs';
        args.textContent = t.input;
        line.appendChild(args);
      }
      if (t.output) {
        const out = document.createElement('div');
        out.className = 'toutput';
        out.textContent = t.output;
        line.appendChild(out);
      }
      ui.toolInner.appendChild(line);
    }
  }
  ui.answer.textContent = (m.answer != null && m.answer !== '') ? m.answer : (m.content || '');
  ui.setDone(m, m.ts);
  return ui;
}

/**
 * 记忆压缩卡片：压缩点标记（默认折叠）+ 模型侧摘要全文 + 转录文件路径。
 * 计入 msgSeq 保持与 /messages 数组下标对齐（评测样本 msgIndex 按数组取数）。
 */
function addCompactionCard(m) {
  const head = m.flat
    ? '🧠 更早的记忆压缩点（点击展开摘要）'
    : (m.count
        ? '🧠 记忆压缩点：上方 ' + m.count + ' 条记录已从会话转录恢复（点击展开模型侧摘要）'
        : '🧠 记忆压缩点：会话转录不可用，压缩前记录缺失（点击展开模型侧摘要）');
  const card = addNode(
    '<details class="compaction-card"><summary></summary><div class="cc-inner"></div></details>');
  card.querySelector('summary').textContent = head;
  const inner = card.querySelector('.cc-inner');
  const body = document.createElement('div');
  body.className = 'cc-text';
  body.textContent = m.content || '';
  inner.appendChild(body);
  if (m.logFile) {
    const f = document.createElement('div');
    f.className = 'cc-file';
    f.textContent = '完整转录文件：' + m.logFile;
    inner.appendChild(f);
  }
  if (m.ts) {
    const t = document.createElement('div');
    t.className = 'cc-ts';
    t.textContent = fmtTime(m.ts);
    inner.appendChild(t);
  }
  msgSeq++;
}

async function deleteSession(id) {
  if (!confirm('删除该会话？聊天记录与 AI 记忆将一并清除，不可恢复。')) return;
  let j = null;
  try {
    const res = await fetch('/api/agent/sessions/' + encodeURIComponent(id) + agentQuery(), { method: 'DELETE' });
    j = await res.json();
    if (!res.ok || j.code !== 0) throw new Error(j.msg || 'HTTP ' + res.status);
  } catch (e) {
    alert('删除失败：' + (e.message || '网络异常'));
    return;
  }
  if (id === sessionId) {
    newSessionId();
    disposeAllCharts();
    if (!showGreeting(currentAgentId())) messagesEl.innerHTML = emptyTipHtml('已开启新会话');
  }
  await loadSessions();
}

btnSend.addEventListener('click', send);
// 停止：调用服务端优雅中断（保留问题+部分回答并落盘），保持 SSE 连接由服务端正常收尾
btnStop.addEventListener('click', async () => {
  stopRequested = true;
  try {
    await fetch('/api/agent/sessions/' + encodeURIComponent(sessionId) + '/stop', { method: 'POST' });
  } catch (e) {
    // 停止接口异常时回退到拆断连接（该轮可能无法落盘）
    if (aborter) aborter.abort();
  }
});
inputEl.addEventListener('keydown', e => {
  if (slashOpen()) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const prevIdx = slashActive;
      slashActive = (slashActive + (e.key === 'ArrowDown' ? 1 : slashItems.length - 1)) % slashItems.length;
      if (slashMenu.children[prevIdx]) slashMenu.children[prevIdx].classList.remove('active');
      if (slashMenu.children[slashActive]) slashMenu.children[slashActive].classList.add('active');
      const act = slashMenu.children[slashActive];
      if (act) act.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); pickSlashTool(slashActive); return; }
    if (e.key === 'Escape') { e.preventDefault(); hideSlashMenu(); return; }
  }
  if (promptOpen()) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const prevIdx = pmActive;
      pmActive = (pmActive + (e.key === 'ArrowDown' ? 1 : pmItems.length - 1)) % pmItems.length;
      if (promptMenu.children[prevIdx]) promptMenu.children[prevIdx].classList.remove('active');
      if (promptMenu.children[pmActive]) promptMenu.children[pmActive].classList.add('active');
      const act = promptMenu.children[pmActive];
      if (act) act.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); pickPrompt(pmActive); return; }
    if (e.key === 'Escape') { e.preventDefault(); hidePromptMenu(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => { autoGrow(); showSlashMenu(); showPromptMenu(); });
inputEl.addEventListener('blur', () => { setTimeout(hideSlashMenu, 150); setTimeout(hidePromptMenu, 150); });
$('btn-new').addEventListener('click', startNewSession);
// 搜索框：输入即时过滤；Esc 清空恢复（过滤逻辑集中在 renderSessions 统一执行）
const searchInput = $('sess-search');
if (searchInput) {
  searchInput.addEventListener('input', renderSessions);
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchInput.value = ''; renderSessions(); }
  });
}

// 初始化：加载会话列表与用户提示词缓存；当前会话有记录则回看，并提示“已恢复旧会话”（await 后插横幅，避免被 loadMessages 清空）
// 恢复的会话 id 不在当前智能体的列表（如上次用的是另一个智能体/主智能体）时按新会话处理，避免续写串台
inputEl.focus();
loadPrompts();
// 先就绪智能体清单再拉会话列表与三清单：showGreeting 依赖 chatAgents（否则首访开场白可能不渲染）；
// 失效选择也在此清除，避免后续请求用旧 agentId（loadChatAgents 全 catch 永不 reject，串行安全）
loadChatAgents().then(() => { refreshCapabilities(); return loadSessions(); }).then(async () => {
  const cur = sessions.find(s => s.sessionId === sessionId);
  if (cur) {
    await loadMessages();
    showResumeTip(cur.title);
    return;
  }
  if (!restoredId) { // 首访新会话：保持首屏提示（选中的智能体有开场白时渲染为首条气泡）
    showGreeting(currentAgentId());
    return;
  }
  // 恢复的旧会话 id 不在当前智能体的列表（如上次用的是另一个智能体）：按新会话处理，避免续写串台
  newSessionId();
  disposeAllCharts();
  if (!showGreeting(currentAgentId())) messagesEl.innerHTML = emptyTipHtml('已开启新会话');
});
</script>
