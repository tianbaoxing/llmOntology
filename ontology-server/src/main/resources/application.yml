server:
  port: 9876

spring:
  application:
    name: ontology
  # 导入项目根目录 .env（含 OPENROUTER_API_KEY 等，已被 .gitignore 忽略）；文件缺失不报错
  config:
    import: optional:file:.env[.properties]
  mvc:
    async:
      request-timeout: 180000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
    # 登录会话有效期（内存会话，重启需重新登录）
    session:
      timeout: 24h
  # MySQL 持久化（P0）：平台数据从 JSON 文件迁入；本地 Docker mysql:8.0 容器 ontology-mysql
  # （宿主机端口 3306）
  datasource:
    url: jdbc:mysql://localhost:3306/ontology?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 与 neo4j 池同风格：本地单用户收紧
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
      max-lifetime: 1800000

# MyBatis-Plus（P0）：主键均为业务键（非自增），下划线列 ↔ 驼峰字段
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

app:
  # 管理页标题（中性产品名，与 README 一致）：业务名不入仓库，本地覆盖任选其一——
  # ① ontology-server/config/application.yml 覆盖 app.title（推荐：YAML 为 UTF-8，中文安全）
  # ② 启动参数 --app.title=xxx ③ 环境变量 APP_TITLE
  # 注意 .env 按 .properties 以 ISO-8859-1 解码，中文会乱码，只适合放 ASCII 值
  title: LLM 驱动的领域本体知识图谱平台
  # 上传文件：实体目录 + 元数据表 file_metadata + 允许的扩展名白名单（文本类，排除视频/音频/图片）
  upload-dir: data/files
  upload-allowed-ext: pdf,txt,csv,md,json,xml,doc,docx,xls,xlsx
  # 二进制文件自动转 Markdown（LLM 只读 MD，不读原件）：
  # md-dir 为 MD 输出目录（镜像 upload-dir 相对路径，命名 <原文件全名>.md）；
  # convert-ext 为触发转换的扩展名；convert-min-chars 为空结果检测阈值
  # （正文有效字符低于该值判 FAILED，典型场景：扫描件 PDF 无文本层）
  md-dir: data/files-md
  convert-ext: pdf,doc,docx,xls,xlsx
  convert-min-chars: 50
  content-security:
    # 检测阈值与策略
    block-threshold: 0.8
    review-threshold: 0.5
    review-strategy: block
    variant-layer-enabled: true
  # 语义改写（/data 页「语义改写配置」Tab）：调用参数
  rewrite:
    # 单次改写 LLM 调用超时与输出上限（独立 rewrite agent 与单项测试共用）
    timeout-seconds: 30
    max-output-tokens: 1000
    # 独立 rewrite agent 的工作区目录（每次改写独立会话，可回查完整 prompt 与输出）
    workspace-dir: data/rewrite-workspace
  # 备份：zip 存放目录（相对 cwd，可用绝对路径覆盖）；文件名编码统计信息（backup-时间-n节点-r关系-f文件-v版本.zip）
  backup-dir: backups
  # 评测 LLM judge（二期）：base-url/api-key/model 缺省复用 app.agent 同名配置
  eval:
    # 样本级通过阈值（样本均分 ≥ 此值且无 error 记通过），summary 通过率与回归对比翻转矩阵同口径
    pass-threshold: 0.8
    judge:
      # 单次判分输出上限与超时（reason 简短即可，控成本；多轮评测器证据更长，400 曾致 JSON 截断解析失败）
      max-output-tokens: 600
      timeout-seconds: 60
      # 判分次数（>1 时多次取平均降噪，对齐 OpenJudge AverageEvaluationStrategy）
      runs: 1
      # judge 专用 HarnessAgent（纯 LLM 管道：无工具/技能/子代理），工作区目录
      workspace-dir: data/eval/judge-workspace
    # Agentic 取证评测（三期模块一）：judge 是带只读图谱工具的 agent，自主查证断言后判分；
    # base-url/api-key/model 缺省复用 app.agent 同名配置
    agent:
      # 取证 ReAct 迭代上限与单样本查询次数硬上限（超限确定性文案截断，按已获证据判分）
      max-iters: 5
      max-queries: 8
      # 输出含 evidence 数组，比纯判分 JSON 长
      max-output-tokens: 1200
      timeout-seconds: 60
      # 取证评测 agent 工作区目录（userId=eval-agentic，可回查每次取证的完整轨迹）
      workspace-dir: data/eval/agentic-workspace
  # AI 问答（AgentScope 2.0 Harness，OpenRouter OpenAI 兼容协议）
  agent:
    base-url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash
    # model: qwen/qwen3.7-flash
    # model: z-ai/glm-5.3-flash
    api-key: ${OPENROUTER_API_KEY:}
    workspace-dir: data/agent-workspace
    # 工作区共享存储（模式1）：true=RemoteFilesystemSpec + MySQL KV（agent_kv_store 表，多副本共享），
    # false=本机 LocalFilesystemSpec（现状）。切换需重启；会话状态两模式同表（agent_state_main）零迁移
    distributed-store:
      enabled: true
    # 记忆 KV 一次性导入：true=启动时把本地 workspace 各用户记忆文件导入 KV 后写 .kv-imported 标记；
    # 仅"首次从本机切共享存储"时开启一次，完成后改回 false。严禁 KV 已积累新记忆时重开（旧文件会覆盖 KV）
    workspace-kv-import:
      enabled: true
    # 文件边界：智能体可访问的唯一数据根（相对 cwd；files/、files-md/、agent-workspace/ 均在其下）。
    # 防线一（harness 文件工具允许根收敛）与防线二（PathBoundaryMiddleware 拦截）均以此为准
    data-root: data
    # 自定义全局技能目录（projectGlobalSkillsDir）：ontology-builder / ontology-query 等技能放这里
    skills-dir: skills
    # get_location 工具（客户端 IP 定位，GeoLite2 本地查询）：
    # mmdb 数据库路径（相对 cwd；约 60MB，勿提交 git，获取渠道见 README）
    location-db: geolite2/GeoLite2-City.mmdb
    # 是否部署在可信反向代理后：true 才采信 X-Forwarded-For / X-Real-IP（直连保持 false 防伪造头）
    location-behind-proxy: false
    # 静态位置兜底（可选）：内网访问或定位失败时 get_location 返回此文本；留空不兜底
    location-static: ""
    # AgentScope Studio 可视化对接地址（留空 = 不启用）；Studio 未启动时降级告警，不阻断主服务
    studio-url: ${STUDIO_URL:http://localhost:3000}
  # MCP 外接工具（Toolkit 原生 registerMcpClient 注册，追踪自动标记 tool_source=mcp）
  # weather-mcp 项目：C:\me\kaiyuan\github\weather-mcp（端口 8766，工具 query_weather）
  # mcp:
  #   weather:
  #     enabled: true
  #     url: http://localhost:8766/mcp

neo4j:
  uri: bolt://localhost:7687
  authentication:
    username: neo4j
    password: neo4j2026
  # 连接池显式参数（driver 5.x 默认：100 连接 / 60s 获取超时，本地单用户收紧为 30）
  pool:
    max-connection-pool-size: 30
    # 从池内取连接的等待上限，超限报错（而非无限排队）
    connection-acquisition-timeout-seconds: 30
    # 建立单条连接（socket）超时，本地回环 15s 足够
    connection-timeout-seconds: 15
    # 连接最长存活时间：防休眠/网络抖动后的半开连接被复用
    max-connection-lifetime-minutes: 30

graph:
  batch-limit: 10000
  dedup:
    per-label-node-limit: 0
