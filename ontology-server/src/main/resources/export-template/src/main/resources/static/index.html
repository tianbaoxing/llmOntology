<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8;
         display: flex; flex-direction: column; height: 100vh; color: #1f2329; }
  header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e6eb; }
  header h1 { font-size: 17px; font-weight: 600; }
  header p { font-size: 12px; color: #86909c; margin-top: 2px; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .bubble { max-width: 78%; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px;
            white-space: pre-wrap; word-break: break-word; }
  .user { margin-left: auto; background: #3370ff; color: #fff; }
  .agent { background: #fff; border: 1px solid #e5e6eb; }
  .agent details { margin: 4px 0; font-size: 12px; color: #4e5969; }
  .agent details summary { cursor: pointer; color: #86909c; user-select: none; }
  .agent details .inner { margin: 6px 0 2px 10px; padding: 8px 10px; background: #f7f8fa;
                          border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .tool-line { margin: 3px 0; }
  .tool-line.end { color: #00b42a; }
  .tname { font-weight: 600; }
  .targs, .toutput { margin: 4px 0 4px 10px; padding: 8px 10px; background: #f7f8fa;
                     border-radius: 6px; font-family: ui-monospace, Consolas, monospace;
                     font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .toutput.err { color: #f53f3f; }
  .tokens { margin-top: 6px; font-size: 11px; color: #86909c; text-align: right; }
  .error-line { color: #f53f3f; font-size: 13px; margin-bottom: 14px; white-space: pre-wrap; }
  footer { display: flex; gap: 10px; padding: 14px 20px; background: #fff;
           border-top: 1px solid #e5e6eb; }
  footer textarea { flex: 1; resize: none; height: 60px; padding: 10px 12px; border: 1px solid #e5e6eb;
                    border-radius: 8px; font: inherit; outline: none; }
  footer textarea:focus { border-color: #3370ff; }
  footer button { padding: 0 24px; border: none; border-radius: 8px; background: #3370ff;
                  color: #fff; font-size: 14px; cursor: pointer; }
  footer button:disabled { background: #a8c6ff; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1 id="title">{{PROJECT_NAME}}</h1>
  <p id="desc"></p>
</header>
<main id="chat"></main>
<footer>
  <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>
<script>
'use strict';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const SS_KEY = 'agent-session-id';
let sessionId = localStorage.getItem(SS_KEY) || '';
let streaming = false;

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addUserMsg(text) {
  const d = document.createElement('div');
  d.className = 'bubble user';
  d.textContent = text;
  chat.appendChild(d);
  scrollBottom();
}

/** 新建一轮 agent 气泡（round start 触发）：思考/工具折叠区 + 回答区 */
function addRound() {
  const b = document.createElement('div');
  b.className = 'bubble agent';
  const think = document.createElement('details');
  const thinkSum = document.createElement('summary');
  thinkSum.textContent = '思考过程';
  const thinkInner = document.createElement('div');
  thinkInner.className = 'inner';
  think.append(thinkSum, thinkInner);
  const tool = document.createElement('details');
  const toolSum = document.createElement('summary');
  toolSum.textContent = '工具调用';
  const toolInner = document.createElement('div');
  toolInner.className = 'inner';
  tool.append(toolSum, toolInner);
  const ans = document.createElement('div');
  const tokens = document.createElement('div');
  tokens.className = 'tokens';
  b.append(think, tool, ans, tokens);
  chat.appendChild(b);
  scrollBottom();
  return { think, thinkInner, tool, toolSum, toolInner, ans, tokens, toolLines: {}, lastEntry: null };
}

function showError(text) {
  const d = document.createElement('div');
  d.className = 'error-line';
  d.textContent = text;
  chat.appendChild(d);
  scrollBottom();
}

/** SSE 块解析与渲染（契约与 llmOntology 平台 chat 页一致） */
function handleSseBlock(block, st) {
  let eventName = 'message';
  const dataLines = [];
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) eventName = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  }
  if (!dataLines.length) return;
  let payload = {};
  try { payload = JSON.parse(dataLines.join('\n')); } catch (e) { payload = { delta: dataLines.join('\n') }; }

  if (eventName === 'session') {
    sessionId = payload.sessionId || sessionId;
    localStorage.setItem(SS_KEY, sessionId);
  } else if (eventName === 'round') {
    if (payload.phase === 'start') {
      st.cur = addRound();
    } else if (payload.phase === 'end' && st.cur) {
      const p = payload.promptTokens || 0, c = payload.completionTokens || 0;
      if (p || c) st.cur.tokens.textContent = '本轮 tokens：↑' + p + ' ↓' + c;
    }
  } else if (eventName === 'thinking') {
    const ui = st.cur || (st.cur = addRound());
    ui.think.style.display = '';
    ui.thinkInner.textContent += (payload.delta || '');
    ui.think.open = true;
    scrollBottom();
  } else if (eventName === 'tool') {
    const ui = st.cur || (st.cur = addRound());
    ui.tool.style.display = '';
    ui.tool.open = true;
    const entry = (payload.id && ui.toolLines[payload.id]) || null;
    if (payload.phase === 'start') {
      const line = document.createElement('div');
      line.className = 'tool-line';
      const tname = document.createElement('span');
      tname.className = 'tname';
      tname.textContent = payload.name || '';
      line.append('▶ 调用 ', tname);
      const args = document.createElement('div');
      args.className = 'targs';
      args.style.display = 'none';
      ui.toolInner.append(line, args);
      if (payload.id) ui.toolLines[payload.id] = { line, args };
      ui.lastEntry = { line, args };
    } else if (payload.phase === 'args') {
      const e = entry || ui.lastEntry;
      if (e && payload.delta) { e.args.style.display = ''; e.args.textContent += payload.delta; }
    } else if (payload.phase === 'end') {
      const e = entry || ui.lastEntry;
      if (e) {
        e.line.textContent = '✓ ';
        const tname = document.createElement('span');
        tname.className = 'tname';
        tname.textContent = payload.name || '';
        e.line.appendChild(tname);
      }
    } else if (payload.phase === 'result-start' || payload.phase === 'result-delta') {
      const e = entry || ui.lastEntry;
      if (e && payload.delta) {
        if (!e.out) {
          e.out = document.createElement('div');
          e.out.className = 'toutput';
          e.line.parentNode.insertBefore(e.out, e.line.nextSibling);
        }
        e.out.style.display = '';
        e.out.textContent += payload.delta;
      }
    } else if (payload.phase === 'result-end') {
      const e = entry || ui.lastEntry;
      if (e && payload.state === 'ERROR' && e.out) e.out.classList.add('err');
    }
    scrollBottom();
  } else if (eventName === 'answer') {
    const ui = st.cur || (st.cur = addRound());
    ui.ans.textContent += (payload.delta || '');
    scrollBottom();
  } else if (eventName === 'error') {
    showError(payload.message || '未知错误');
  }
}

async function send() {
  const message = input.value.trim();
  if (!message || streaming) return;
  streaming = true;
  sendBtn.disabled = true;
  input.value = '';
  addUserMsg(message);
  const st = { cur: null };
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, sessionId })
    });
    if (!resp.ok) {
      let msg = 'HTTP ' + resp.status;
      try { const e = await resp.json(); if (e.message) msg = e.message; } catch (ignore) {}
      showError(msg);
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleSseBlock(block, st);
      }
    }
  } catch (e) {
    showError('请求异常：' + (e.message || e));
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

(async function init() {
  try {
    const resp = await fetch('/api/meta');
    if (resp.ok) {
      const meta = await resp.json();
      if (meta.name) document.getElementById('title').textContent = meta.name;
      if (meta.description) document.getElementById('desc').textContent = meta.description;
      if (meta.greeting) {
        const b = document.createElement('div');
        b.className = 'bubble agent';
        b.textContent = meta.greeting;
        chat.appendChild(b);
      }
    }
  } catch (ignore) {
    // 元信息失败不阻断聊天
  }
  input.focus();
})();
</script>
</body>
</html>
