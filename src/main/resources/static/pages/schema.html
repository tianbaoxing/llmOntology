<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念层管理</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='9' y='3' width='5' height='9' rx='1.5' fill='%23e3b04b'/%3E%3Crect x='34' y='3' width='5' height='9' rx='1.5' fill='%23e3b04b'/%3E%3Cpath d='M5 11h38l-4.5 21h-29Z' fill='%23e3b04b'/%3E%3Cpath d='M14 19L24 15.5 34 19 24 27.5Z' stroke='%238a5a18' stroke-width='1.8' fill='none' opacity='.7'/%3E%3Ccircle cx='14' cy='19' r='3' fill='%2338bdf8'/%3E%3Ccircle cx='34' cy='19' r='3' fill='%2338bdf8'/%3E%3Ccircle cx='24' cy='15.5' r='3' fill='%23f8fafc'/%3E%3Ccircle cx='24' cy='27.5' r='3' fill='%2338bdf8'/%3E%3Cpath d='M12 32l-3 13h6l1.5-13Z' fill='%23e3b04b'/%3E%3Cpath d='M36 32l3 13h-6l-1.5-13Z' fill='%23e3b04b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/pages/common.css">
</head>
<body>
<div class="container">
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>类列表</h2>
    <div class="toolbar">
      <button class="btn" onclick="editClass()">+ 新增类</button>
      <span class="muted">新增/修改立即生效（热更新白名单），删除受引用与实例保护（409）</span>
    </div>
    <div id="sc-classes"></div>
  </div>
  <div class="card" id="sc-detail-card" style="display:none">
    <h2>类详情：<span id="sc-detail-name"></span></h2>
    <div id="sc-detail"></div>
  </div>
  <div class="card" id="sc-form-card" style="display:none">
    <h2 id="sc-form-title">新增类</h2>
    <div class="grid2">
      <div>
        <div class="detail-item"><b>name</b><input type="text" id="f-name" placeholder="如 Person"></div>
        <div class="detail-item"><b>cnName</b><input type="text" id="f-cnName" placeholder="如 人物"></div>
        <div class="detail-item"><b>layer</b>
          <select id="f-layer"><option value="concept">concept</option><option value="instance">instance</option></select></div>
        <div class="detail-item"><b>keyProp</b><input type="text" id="f-keyProp" placeholder="如 name"></div>
        <div class="detail-item"><b>description</b><input type="text" id="f-desc" placeholder="描述"></div>
      </div>
      <div>
        <div class="detail-item"><b>properties</b>
          <textarea id="f-props" placeholder='[{"name":"name","cnName":"姓名","dataType":"STRING","required":true}]'></textarea></div>
        <div class="detail-item"><b>relations</b>
          <textarea id="f-rels" placeholder='[{"name":"LIVED_IN_ERA","cnName":"生活于","toClass":"Era"}] 或 []'></textarea></div>
      </div>
    </div>
    <div style="margin-top:12px">
      <button class="btn" onclick="saveClass()">保存</button>
      <button class="btn ghost" onclick="hideClassForm()">取消</button>
    </div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
let schemaCache = null;   // { classes:[...], relations:[...] }
let classSummaries = [];

// ---------------- 概念层 ----------------
async function loadSchemaPanel() {
  classSummaries = await api('GET', '/api/schema/classes');
  schemaCache = await api('GET', '/api/schema');
  $('sc-classes').innerHTML = table(
    ['类名', '中文名', '层', 'keyProp', '实例数', '属性', '出边关系', '操作'],
    classSummaries.map(c => [
      code(c.name), esc(c.cnName), badge(c.layer), code(c.keyProp), c.count,
      c.propertyCount, c.relationCount,
      `<button class="btn sm" onclick="showClassDetail('${esc(c.name)}')">详情</button>` +
      `<button class="btn sm ghost" onclick="editClass('${esc(c.name)}')">编辑</button>` +
      `<button class="btn sm danger" onclick="removeClass('${esc(c.name)}')">删除</button>`
    ]));
}

async function showClassDetail(name) {
  const d = await api('GET', '/api/schema/classes/' + encodeURIComponent(name));
  $('sc-detail-card').style.display = 'block';
  $('sc-detail-name').textContent = name;
  const props = d.properties.map(p =>
    `<tr><td>${code(p.name)}</td><td>${esc(p.cnName)}</td><td>${p.dataType}</td>` +
    `<td>${p.required ? '是' : '否'}</td><td>${esc(p.description || '')}</td></tr>`).join('');
  const rels = d.relations.map(r =>
    `<tr><td>${code(r.name)}</td><td>${esc(r.cnName)}</td><td>${code(d.name)} → ${code(r.toClass)}</td>` +
    `<td>${r.count}</td><td>${esc(r.example || '')}</td></tr>`).join('');
  const incoming = d.incomingRelations.map(r =>
    `<tr><td>${code(r.name)}</td><td>${esc(r.cnName)}</td><td>${code(r.fromClass)} → ${code(d.name)}</td>` +
    `<td>${r.count}</td></tr>`).join('');
  $('sc-detail').innerHTML =
    `<div class="detail-item"><b>描述</b>${esc(d.description || '')}</div>` +
    `<h2 style="margin:10px 0 8px">属性（${d.properties.length}）</h2>` +
    `<table><tr><th>属性</th><th>中文名</th><th>类型</th><th>必填</th><th>说明</th></tr>${props}</table>` +
    (rels ? `<h2 style="margin:14px 0 8px">出边关系（声明，${d.relations.length}）</h2>` +
      `<table><tr><th>关系</th><th>中文名</th><th>方向</th><th>实例数</th><th>示例</th></tr>${rels}</table>` : '') +
    (incoming ? `<h2 style="margin:14px 0 8px">入边关系（推导，${d.incomingRelations.length}）</h2>` +
      `<table><tr><th>关系</th><th>中文名</th><th>方向</th><th>实例数</th></tr>${incoming}</table>` : '');
}

function editClass(name) {
  $('sc-form-card').style.display = 'block';
  if (name) {
    const c = schemaCache.classes.find(c => c.name === name);
    $('sc-form-title').textContent = '编辑类：' + name;
    $('f-name').value = c.name; $('f-name').disabled = true;
    $('f-cnName').value = c.cnName; $('f-layer').value = c.layer;
    $('f-keyProp').value = c.keyProp; $('f-keyProp').disabled = true;
    $('f-desc').value = c.description || '';
    $('f-props').value = JSON.stringify(c.properties, null, 1);
    $('f-rels').value = JSON.stringify(c.relations.map(({name, cnName, toClass, description, example, props}) =>
      ({name, cnName, toClass, description, example, props})), null, 1);
  } else {
    $('sc-form-title').textContent = '新增类';
    ['f-name', 'f-cnName', 'f-keyProp', 'f-desc', 'f-props', 'f-rels'].forEach(i => $(i).value = '');
    $('f-name').disabled = false; $('f-keyProp').disabled = false;
    $('f-layer').value = 'concept';
    $('f-props').value = '[{"name":"name","cnName":"名称","dataType":"STRING","required":true}]';
    $('f-rels').value = '[]';
  }
  $('sc-form-card').scrollIntoView({ behavior: 'smooth' });
}

function hideClassForm() { $('sc-form-card').style.display = 'none'; }

function saveClass() {
  doAction(async () => {
    const body = {
      name: $('f-name').value.trim(), cnName: $('f-cnName').value.trim(),
      layer: $('f-layer').value, keyProp: $('f-keyProp').value.trim(),
      description: $('f-desc').value.trim(),
      properties: JSON.parse($('f-props').value || '[]'),
      relations: JSON.parse($('f-rels').value || '[]')
    };
    const editing = !$('f-name').disabled;
    const r = editing
      ? await api('PUT', '/api/schema/classes/' + encodeURIComponent(body.name), body)
      : await api('POST', '/api/schema/classes', body);
    hideClassForm();
    await loadSchemaPanel();
    return r;
  });
}

function removeClass(name) {
  if (!confirm('确认删除类 ' + name + '？\n（被引用或仍有实例会被拒绝 409）')) return;
  doAction(async () => {
    const r = await api('DELETE', '/api/schema/classes/' + encodeURIComponent(name));
    await loadSchemaPanel();
    $('sc-detail-card').style.display = 'none';
    return r;
  });
}

// ---------------- init ----------------
CF.renderHeader();
CF.initUser();
loadSchemaPanel().catch(e => showMsg('加载失败：' + e.message, false));
</script>
</body>
</html>
