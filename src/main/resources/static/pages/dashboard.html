<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>驾驶舱</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
<style>
/* 驾驶舱专属：每日用量柱状图 */
.range-btns .btn.on { background: #2563eb; color: #fff; border-color: #2563eb; }
#daily-svg { display: block; background: #fff; }
#daily-legend { font-size: 12px; color: #6b7280; display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; }
#daily-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
#view-banner { display: none; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 8px; padding: 10px 16px; font-size: 14px; margin-bottom: 14px; }
#dash-sessions tr { cursor: pointer; }
/* 最近活动列：不换行，日期时间保持一行并收紧列宽 */
#dash-sessions td:nth-child(2), #dash-sessions th:nth-child(2) { white-space: nowrap; }
#dash-sessions a.session-link { color: #2563eb; text-decoration: none; }
#dash-sessions a.session-link:hover { text-decoration: underline; }
.pager { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.pager .cur { background: #2563eb; color: #fff; border: 1px solid #2563eb; border-radius: 6px; padding: 4px 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div id="msg" class="msg"></div>
  <div id="view-banner"></div>

  <div class="stats-row" id="dash-stats"></div>
  <div class="card">
    <h2>每日 Token 用量</h2>
    <div class="toolbar">
      <span class="range-btns" style="display:inline-flex;gap:6px">
        <button class="btn ghost sm on" data-days="7">近 7 天</button>
        <button class="btn ghost sm" data-days="30">近 30 天</button>
        <button class="btn ghost sm" data-days="90">近 90 天</button>
      </span>
      <span id="daily-legend">
        <span><i style="background:#3b82f6"></i>输入</span>
        <span style="margin-left:10px"><i style="background:#22c55e"></i>输出</span>
      </span>
    </div>
    <svg id="daily-svg" viewBox="0 0 1100 320" width="100%" height="320"></svg>
  </div>
  <div class="card">
    <h2>会话用量明细</h2>
    <div class="muted" style="margin-bottom:10px">统计口径：轮次 = 会话内用户提问次数；LLM 调用 = 会话内模型推理次数（含工具调用后的再次推理）</div>
    <div id="dash-sessions"></div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
let STATS = null;
let rangeDays = 7;
// 会话明细分页（纯前端分页：数据已随 stats 全量返回）
const SESSION_PAGE_SIZE = 10;
let sessionPage = 1;
// URL 带 userId 参数时查看指定用户（管理员入口），否则统计当前登录用户自己
const viewUserId = new URLSearchParams(location.search).get('userId');

function fmtNum(n) { return Number(n || 0).toLocaleString('zh-CN'); }
// Token 大数用 K/M/G 单位缩写（单位字母带不同颜色），小数值保持原样；返回 HTML 仅用于卡片 innerHTML
function fmtToken(n) {
  const v = Number(n || 0);
  const abs = Math.abs(v);
  if (abs >= 1e9) return numHtml((v / 1e9).toFixed(2).replace(/\.?0+$/, ''), 'G');
  if (abs >= 1e6) return numHtml((v / 1e6).toFixed(2).replace(/\.?0+$/, ''), 'M');
  if (abs >= 1e3) return numHtml((v / 1e3).toFixed(1).replace(/\.0$/, ''), 'K');
  return fmtNum(v);
}
function numHtml(num, unit) {
  const color = unit === 'K' ? '#f59e0b' : unit === 'M' ? '#8b5cf6' : '#ef4444';
  return `<span style="color:${color}">${num}<span style="font-size:0.72em;margin-left:1px">${unit}</span></span>`;
}

async function load() {
  STATS = await api('GET', viewUserId ? '/api/dashboard/stats/' + encodeURIComponent(viewUserId) : '/api/dashboard/stats');
  renderStats();
  renderDaily();
  renderSessions();
}

function renderStats() {
  const s = STATS.summary;
  $('dash-stats').innerHTML =
    statCard(fmtToken(s.totalTokens), '总 Token') +
    statCard(fmtToken(s.todayTokens), '今日 Token') +
    statCard(fmtToken(s.inputTokens), '输入 Token') +
    statCard(fmtToken(s.outputTokens), '输出 Token') +
    statCard(fmtToken(s.cachedTokens), '缓存命中 Token') +
    statCard(fmtNum(s.sessions), '会话数') +
    statCard(fmtNum(s.rounds), '提问轮次') +
    statCard(fmtNum(s.llmCalls), 'LLM 调用次数');
}

function renderDaily() {
  const byDate = {};
  (STATS.daily || []).forEach(d => byDate[d.date] = d);
  const dates = [];
  const now = new Date();
  for (let i = rangeDays - 1; i >= 0; i--) {
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    dates.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'));
  }
  const data = dates.map(d => byDate[d] ||
    { date: d, inputTokens: 0, outputTokens: 0, tokens: 0, rounds: 0, llmCalls: 0 });
  const W = 1100, H = 320, padL = 78, padR = 10, padT = 16, padB = 34;
  const max = Math.max(1, ...data.map(d => d.tokens));
  const bw = (W - padL - padR) / data.length;
  let s = '';
  for (let i = 0; i <= 4; i++) {
    const v = Math.round(max * i / 4), y = padT + (H - padB - padT) * (1 - i / 4);
    s += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="#e5e7eb"/>` +
         `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9ca3af">${fmtNum(v)}</text>`;
  }
  const labelStep = Math.ceil(data.length / 12);
  data.forEach((d, i) => {
    const x = padL + i * bw;
    const hIn = (H - padB - padT) * d.inputTokens / max;
    const hOut = (H - padB - padT) * d.outputTokens / max;
    if (d.tokens > 0) {
      const tip = `${d.date}｜输入 ${fmtNum(d.inputTokens)}｜输出 ${fmtNum(d.outputTokens)}｜合计 ${fmtNum(d.tokens)}｜轮次 ${d.rounds}｜LLM 调用 ${d.llmCalls}`;
      s += `<g><title>${tip}</title>` +
           `<rect x="${(x + bw * 0.18).toFixed(1)}" y="${(H - padB - hIn - hOut).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${hOut.toFixed(1)}" fill="#22c55e"/>` +
           `<rect x="${(x + bw * 0.18).toFixed(1)}" y="${(H - padB - hIn).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${hIn.toFixed(1)}" fill="#3b82f6"/></g>`;
    }
    if (i % labelStep === 0) {
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="#9ca3af">${d.date.slice(5)}</text>`;
    }
  });
  $('daily-svg').innerHTML = s;
}

function renderSessions() {
  const list = STATS.sessions || [];
  if (!list.length) {
    $('dash-sessions').innerHTML = '<div class="muted">暂无会话数据</div>';
    return;
  }
  const pages = Math.max(1, Math.ceil(list.length / SESSION_PAGE_SIZE));
  if (sessionPage > pages) sessionPage = pages;
  const rows = list.slice((sessionPage - 1) * SESSION_PAGE_SIZE, sessionPage * SESSION_PAGE_SIZE);
  const total = Math.max(1, STATS.summary.totalTokens);
  let html = table(
    ['会话', '最近活动', '轮次', 'LLM 调用', '输入', '输出', '缓存命中', '合计', '占比'],
    rows.map(v => {
      const pct = Math.min(100, v.tokens * 100 / total).toFixed(1);
      const href = '/session-detail?sessionId=' + encodeURIComponent(v.sessionId) +
        (viewUserId ? '&userId=' + encodeURIComponent(viewUserId) : '');
      return [`<a class="session-link" href="${href}" target="_blank" title="查看会话详情">${esc(v.title)}</a>`,
        esc(v.lastTime || '-'), fmtNum(v.rounds), fmtNum(v.llmCalls),
        fmtNum(v.inputTokens), fmtNum(v.outputTokens), fmtNum(v.cachedTokens), fmtNum(v.tokens),
        `<span class="muted">${pct}%</span>`];
    }));
  if (pages > 1) {
    const win = [];
    const start = Math.max(1, Math.min(sessionPage - 2, pages - 4));
    for (let i = start; i <= Math.min(pages, start + 4); i++) win.push(i);
    const btn = (label, target, dis) =>
      `<button class="btn sm" ${dis ? 'disabled' : ''} onclick="goSessionsPage(${target})">${label}</button>`;
    html += `<div style="display:flex; gap:10px; align-items:center; margin-top:10px">`
      + `<span class="muted">共 ${list.length} 条 / ${pages} 页</span><div class="pager" style="margin-top:0">`
      + btn('首页', 1, sessionPage === 1) + btn('上一页', sessionPage - 1, sessionPage === 1)
      + (start > 1 ? '<span class="muted">…</span>' : '')
      + win.map(i => i === sessionPage ? `<span class="cur">${i}</span>` : btn(i, i, false)).join('')
      + (start + 4 < pages ? '<span class="muted">…</span>' : '')
      + btn('下一页', sessionPage + 1, sessionPage === pages) + btn('尾页', pages, sessionPage === pages)
      + '</div></div>';
  }
  $('dash-sessions').innerHTML = html;
}

function goSessionsPage(n) {
  const list = STATS.sessions || [];
  const pages = Math.max(1, Math.ceil(list.length / SESSION_PAGE_SIZE));
  if (n < 1 || n > pages || n === sessionPage) return;
  sessionPage = n;
  renderSessions();
}

// 整行点击跳会话详情（点链接本身走默认新标签行为，避免开两个）
$('dash-sessions').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const a = e.target.closest('tr')?.querySelector('a.session-link');
  if (a) window.open(a.href, '_blank');
});

document.querySelectorAll('.range-btns button').forEach(b => {
  b.onclick = () => {
    rangeDays = Number(b.dataset.days);
    document.querySelectorAll('.range-btns button').forEach(x => x.classList.toggle('on', x === b));
    renderDaily();
  };
});

if (viewUserId) {
  const b = $('view-banner');
  b.style.display = 'block';
  b.textContent = '正在查看用户：' + viewUserId;
}
CF.renderHeader(viewUserId ? { titleSuffix: ' · 用户 ' + viewUserId } : {});
CF.initUser();
load().catch(e => showMsg('加载失败：' + e.message, false));
</script>
</body>
</html>
