<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
<style>
.badge.role-admin { background: #fef3c7; color: #b45309; }
.badge.role-user { background: #e5e7eb; color: #4b5563; }
.badge.st-active { background: #dcfce7; color: #15803d; }
.badge.st-pending { background: #dbeafe; color: #1d4ed8; }
.badge.st-disabled { background: #fee2e2; color: #b91c1c; }
.self-mark { color: #2563eb; font-size: 12px; margin-left: 6px; }
/* 记忆查看模态框 */
.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-box { background: #fff; border-radius: 10px; width: min(960px, 92vw); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #e5e7eb; }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-close { border: none; background: none; font-size: 20px; color: #6b7280; cursor: pointer; line-height: 1; }
.modal-body { display: flex; min-height: 0; flex: 1; }
.mem-files { width: 220px; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 10px; flex-shrink: 0; }
.mem-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
.mem-item:hover { background: #f3f4f6; }
.mem-item.on { background: #eff6ff; border-color: #bfdbfe; }
.mem-item .nm { font-size: 13px; font-weight: 600; color: #1f2937; word-break: break-all; }
.mem-item .meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
.mem-item .tag { display: inline-block; font-size: 11px; background: #fef3c7; color: #b45309; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
.mem-detail { flex: 1; overflow-y: auto; padding: 14px 18px; }
.mem-section { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.mem-section .sec-head { background: #f8fafc; padding: 6px 12px; font-size: 12px; color: #475569; border-bottom: 1px solid #e5e7eb; font-family: Consolas, monospace; }
.mem-section .sec-body { padding: 10px 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #1f2937; }
.mem-empty { color: #9ca3af; text-align: center; padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div id="msg" class="msg"></div>
  <div class="card">
    <h2>用户列表</h2>
    <div class="toolbar">
      <select id="filter-status">
        <option value="">全部状态</option>
        <option value="PENDING">待审核</option>
        <option value="ACTIVE">已启用</option>
        <option value="DISABLED">已禁用</option>
      </select>
      <span class="muted">注册用户需审核通过后才能登录；密码以 PBKDF2 加密存储于 data/users.json</span>
    </div>
    <div id="user-list"></div>
  </div>
  <div class="card">
    <h2>修改我的密码</h2>
    <div class="toolbar">
      <input type="password" id="pwd-old" placeholder="原密码" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:13px;">
      <input type="password" id="pwd-new" placeholder="新密码（至少 6 位）" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:5px;font-size:13px;">
      <button class="btn" onclick="changeMyPassword()">修改密码</button>
      <span class="muted">修改成功后下次登录使用新密码，当前会话不受影响</span>
    </div>
  </div>
</div>

<!-- 记忆查看模态框 -->
<div class="modal-mask" id="mem-modal" style="display:none" onclick="if(event.target===this)closeMemory()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="mem-title">Agent 记忆</h3>
      <button class="modal-close" onclick="closeMemory()">×</button>
    </div>
    <div class="modal-body">
      <div class="mem-files" id="mem-files"></div>
      <div class="mem-detail" id="mem-detail"></div>
    </div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
let me = null;

function roleBadge(role) {
  return `<span class="badge ${role === 'ADMIN' ? 'role-admin' : 'role-user'}">${role === 'ADMIN' ? '管理员' : '普通用户'}</span>`;
}

function statusBadge(status) {
  const map = { ACTIVE: ['st-active', '已启用'], PENDING: ['st-pending', '待审核'], DISABLED: ['st-disabled', '已禁用'] };
  const [cls, text] = map[status] || ['role-user', status];
  return `<span class="badge ${cls}">${text}</span>`;
}

function actionsHtml(u) {
  let html = `<button class="btn sm ghost" onclick="showMemory('${esc(u.userId)}')">记忆</button>` +
    `<button class="btn sm ghost" onclick="openDashboard('${esc(u.userId)}')">驾驶舱</button>`;
  if (!me || u.userId === me.userId) return html + '<span class="muted">当前登录账号</span>';
  if (u.status === 'PENDING') {
    html += `<button class="btn sm" onclick="approveUser('${esc(u.userId)}')">通过审核</button>`;
  }
  if (u.status === 'ACTIVE') {
    html += `<button class="btn sm ghost" onclick="toggleUser('${esc(u.userId)}', false)">禁用</button>`;
  }
  if (u.status === 'DISABLED' || u.status === 'PENDING') {
    html += `<button class="btn sm" onclick="toggleUser('${esc(u.userId)}', true)">启用</button>`;
  }
  html += `<button class="btn sm ghost" onclick="resetPassword('${esc(u.userId)}')">重置密码</button>`;
  html += `<button class="btn sm danger" onclick="deleteUser('${esc(u.userId)}')">删除</button>`;
  return html;
}

async function loadUsers() {
  const status = $('filter-status').value;
  const d = await api('GET', '/api/users' + (status ? '?status=' + status : ''));
  $('user-list').innerHTML = d.users.length ? '<table>' +
    '<tr><th>用户ID</th><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>最后登录</th><th>操作</th></tr>' +
    d.users.map(u => `<tr>
      <td><code>${esc(u.userId)}</code>${u.userId === (me && me.userId) ? '<span class="self-mark">（我）</span>' : ''}</td>
      <td>${esc(u.username)}</td>
      <td>${roleBadge(u.role)}</td>
      <td>${statusBadge(u.status)}</td>
      <td class="muted">${esc(u.createdAt || '-')}</td>
      <td class="muted">${esc(u.lastLoginAt || '从未登录')}</td>
      <td>${actionsHtml(u)}</td>
    </tr>`).join('') + '</table>'
    : '<div class="muted" style="padding:20px 0">暂无用户</div>';
}

function doAction(fn) {
  fn().then(d => { showMsg('操作成功', true); loadUsers(); }).catch(e => showMsg('失败：' + e.message, false));
}

function openDashboard(userId) {
  window.open('/dashboard?userId=' + encodeURIComponent(userId), '_blank');
}

function approveUser(userId) {
  if (!confirm('确认通过用户「' + userId + '」的审核？通过后即可登录')) return;
  doAction(() => api('PATCH', '/api/users/' + encodeURIComponent(userId), { status: 'APPROVED' }));
}

function toggleUser(userId, enabled) {
  const tip = enabled ? '启用' : '禁用';
  if (!confirm('确认' + tip + '用户「' + userId + '」？' + (enabled ? '' : '禁用后该用户将无法登录'))) return;
  doAction(() => api('PATCH', '/api/users/' + encodeURIComponent(userId), { status: enabled ? 'ACTIVE' : 'DISABLED' }));
}

function resetPassword(userId) {
  const pwd = prompt('为用户「' + userId + '」设置新密码（至少 6 位）：');
  if (pwd === null) return;
  if (pwd.length < 6) return showMsg('密码至少 6 位', false);
  doAction(() => api('POST', '/api/users/' + encodeURIComponent(userId) + '/password', { newPassword: pwd }));
}

function deleteUser(userId) {
  if (!confirm('确认删除用户「' + userId + '」？删除后不可恢复')) return;
  doAction(() => api('DELETE', '/api/users/' + encodeURIComponent(userId)));
}

function changeMyPassword() {
  const oldPwd = $('pwd-old').value, newPwd = $('pwd-new').value;
  if (newPwd.length < 6) return showMsg('新密码至少 6 位', false);
  api('PUT', '/api/users/me/password', { oldPassword: oldPwd, newPassword: newPwd })
    .then(() => { showMsg('密码修改成功', true); $('pwd-old').value = ''; $('pwd-new').value = ''; })
    .catch(e => showMsg('失败：' + e.message, false));
}

// ---------------- 记忆查看 ----------------
let memUserId = null;

async function showMemory(userId) {
  memUserId = userId;
  $('mem-title').textContent = 'Agent 记忆 — ' + userId;
  $('mem-modal').style.display = 'flex';
  $('mem-files').innerHTML = '<div class="mem-empty">加载中…</div>';
  $('mem-detail').innerHTML = '';
  try {
    const d = await api('GET', '/api/users/' + encodeURIComponent(userId) + '/memory');
    renderMemFiles(d);
  } catch (e) {
    $('mem-files').innerHTML = '';
    $('mem-detail').innerHTML = '<div class="mem-empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function closeMemory() {
  $('mem-modal').style.display = 'none';
  memUserId = null;
}

function renderMemFiles(d) {
  const items = [];
  if (d.curated) {
    items.push({ name: d.curated.name, entries: d.curated.entries, size: d.curated.size, tag: '策展记忆' });
  }
  (d.daily || []).forEach(f => items.push({ name: f.name, entries: f.entries, size: f.size }));
  if (!items.length) {
    $('mem-files').innerHTML = '';
    $('mem-detail').innerHTML = '<div class="mem-empty">该用户暂无记忆</div>';
    return;
  }
  $('mem-files').innerHTML = items.map(f =>
    `<div class="mem-item" data-name="${esc(f.name)}" onclick="loadMemFile('${esc(f.name)}')">` +
    `<div class="nm">${esc(f.name)}${f.tag ? '<span class="tag">' + f.tag + '</span>' : ''}</div>` +
    `<div class="meta">${f.entries} 段 · ${fmtSize(f.size)}</div></div>`).join('');
  // 默认选中策展记忆（无则选第一个每日文件）
  loadMemFile(d.curated ? d.curated.name : items[0].name);
}

async function loadMemFile(name) {
  if (!memUserId) return;
  document.querySelectorAll('.mem-item').forEach(el => el.classList.toggle('on', el.dataset.name === name));
  $('mem-detail').innerHTML = '<div class="mem-empty">加载中…</div>';
  try {
    const d = await api('GET', '/api/users/' + encodeURIComponent(memUserId) + '/memory/file/' + encodeURIComponent(name));
    const secs = d.sections || [];
    $('mem-detail').innerHTML = secs.length
      ? secs.map(s => `<div class="mem-section">` +
          `<div class="sec-head">${esc(s.time || s.date || '—')}</div>` +
          `<div class="sec-body">${esc(s.content)}</div></div>`).join('')
      : '<div class="mem-empty">文件内容为空</div>';
  } catch (e) {
    $('mem-detail').innerHTML = '<div class="mem-empty">加载失败：' + esc(e.message) + '</div>';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMemory(); });

$('filter-status').onchange = () => loadUsers().catch(e => showMsg('加载失败：' + e.message, false));

// init：header 渲染 + 登录校验由 common.js 提供（拦截器已保证仅 ADMIN 可达此页）
CF.renderHeader();
CF.initUser(m => {
  me = m;
  loadUsers().catch(e => showMsg('用户列表加载失败：' + e.message, false));
});
</script>
</body>
</html>
