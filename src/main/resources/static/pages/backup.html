<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备份恢复</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
</head>
<body>
<div class="container">
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>立即备份</h2>
    <div class="toolbar">
      <button class="btn" id="bk-btn" onclick="startBackup()">立即备份</button>
      <span class="muted">备份图数据库全量（节点/关系）+ data 配置三 JSON + 上传文件目录，打包为单个 zip 存于 backups/ 目录</span>
    </div>
    <div id="bk-progress-wrap" style="display:none">
      <div style="background:#e5e7eb;border-radius:5px;height:18px;overflow:hidden">
        <div id="bk-bar" style="background:#2563eb;height:100%;width:0%;transition:width .3s"></div>
      </div>
      <div class="muted" style="margin-top:6px" id="bk-detail"></div>
    </div>
  </div>
  <div class="card">
    <h2>备份列表</h2>
    <div class="muted" style="margin-bottom:10px">列表由 backups/ 目录文件名解析（时间-节点数-关系数-文件数-schema版本）；下载可将 zip 留存到其他位置</div>
    <div id="bk-list"></div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
// ---------------- 备份 ----------------
let bkTaskId = null;

async function startBackup() {
  try {
    const d = await api('POST', '/api/backups');
    bkTaskId = d.taskId;
  } catch (e) { return showMsg('启动失败：' + e.message, false); }
  $('bk-btn').disabled = true;
  $('bk-progress-wrap').style.display = 'block';
  $('bk-bar').style.width = '0%';
  $('bk-detail').textContent = '准备中';
  pollBackup();
}

function pollBackup() {
  api('GET', '/api/backups/tasks/' + encodeURIComponent(bkTaskId)).then(p => {
    $('bk-bar').style.width = p.percent + '%';
    $('bk-detail').textContent = p.detail + '（' + p.percent + '%）';
    if (p.status === 'running') { setTimeout(pollBackup, 800); return; }
    $('bk-btn').disabled = false;
    if (p.status === 'success') {
      $('bk-detail').textContent = '备份完成：' + p.backupName;
      showMsg('备份完成：' + p.backupName, true);
      loadBackups().catch(() => {});
    } else {
      showMsg('备份失败：' + (p.error || '未知错误'), false);
    }
  }).catch(e => {
    $('bk-btn').disabled = false;
    showMsg('进度获取失败：' + e.message, false);
  });
}

async function loadBackups() {
  const d = await api('GET', '/api/backups');
  $('bk-list').innerHTML = d.backups.length ? table(
    ['备份文件', '时间', '大小', '节点', '关系', '文件数', 'schema版本', '操作'],
    d.backups.map(b => [
      code(b.name), esc(b.time), fmtSize(b.size), b.nodeCount, b.relCount, b.fileCount, 'v' + b.schemaVersion,
      `<a class="btn sm" href="/api/backups/${encodeURIComponent(b.name)}/file">下载</a>` +
      `<button class="btn sm danger" onclick="deleteBackup('${encodeURIComponent(b.name)}')">删除</button>`
    ])) : '<div class="muted">暂无备份</div>';
}

async function deleteBackup(encName) {
  const name = decodeURIComponent(encName);
  if (!confirm('确认删除备份「' + name + '」？删除后不可恢复')) return;
  doAction(async () => {
    const d = await api('DELETE', '/api/backups/' + encodeURIComponent(name));
    loadBackups().catch(() => {});
    return d;
  });
}

// ---------------- init ----------------
CF.renderHeader();
CF.initUser();
loadBackups().catch(e => showMsg('备份列表加载失败：' + e.message, false));
</script>
</body>
</html>
