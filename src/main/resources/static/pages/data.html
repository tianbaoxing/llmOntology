<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图谱管理</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/pages/common.css">
<style>
/* 页内 Tab（图数据 / 概念层） */
.page-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.ptab { padding: 8px 22px; border-radius: 6px; cursor: pointer; background: #fff; color: #6b7280; border: 1px solid #e5e7eb; user-select: none; }
.ptab.active { background: #2563eb; color: #fff; font-weight: 600; border-color: #2563eb; }
</style>
</head>
<body>
<div class="container">
  <div id="msg" class="msg"></div>

  <div class="page-tabs">
    <a class="ptab active" data-tab="data" onclick="switchTab('data')">图数据</a>
    <a class="ptab" data-tab="schema" onclick="switchTab('schema')">概念层</a>
  </div>

  <!-- Tab 1：图数据 -->
  <div id="tab-data">
    <div class="grid2">
      <div class="card">
        <h2>节点操作</h2>
        <div class="toolbar">
          <select id="n-label"></select>
          <input type="text" id="n-key" placeholder="键值（如 宋）">
          <button class="btn" onclick="queryNode()">查询</button>
        </div>
        <div class="detail-item"><b>新建/覆盖</b>
          <textarea id="n-create" placeholder='{"name":"测试节点"}（含 keyProp，MERGE 幂等）'></textarea></div>
        <div class="toolbar">
          <button class="btn" onclick="createNode()">创建节点</button>
          <button class="btn" onclick="updateNode()">更新属性</button>
          <button class="btn danger" onclick="deleteNode()">删除节点</button>
        </div>
        <div class="muted">更新/删除按上方 label+键值 定位；删除默认 detach（连带关系）</div>
        <div id="n-detail" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h2>关系操作</h2>
        <div class="toolbar">
          <select id="r-type"></select>
        </div>
        <div class="detail-item"><b>from 键值</b><input type="text" id="r-from" placeholder="起点键值"></div>
        <div class="detail-item"><b>to 键值</b><input type="text" id="r-to" placeholder="终点键值"></div>
        <div class="detail-item"><b>props</b>
          <textarea id="r-props" placeholder='{} 或 {"note":"备注"}（创建/更新时写入）'></textarea></div>
        <div class="toolbar">
          <button class="btn" onclick="createRel()">创建关系</button>
          <button class="btn" onclick="updateRel()">更新属性</button>
          <button class="btn danger" onclick="deleteRel()">删除关系</button>
        </div>
        <div class="muted">关系的两端 label 由所选类型的 schema 声明决定（签名校验）</div>
      </div>
    </div>
  </div>

  <!-- Tab 2：概念层 -->
  <div id="tab-schema" style="display:none">
    <div class="card">
      <h2>类列表</h2>
      <div class="toolbar">
        <button class="btn" onclick="editClass()">+ 新增类</button>
        <span class="muted">新增/修改立即生效（热更新白名单），删除受引用与实例保护（409）</span>
      </div>
      <div id="sc-classes"></div>
    </div>
    <div class="card" id="sc-detail-card" style="display:none">
      <h2>类详情：<span id="sc-detail-name"></span></h2>
      <div id="sc-detail"></div>
    </div>
    <div class="card" id="sc-form-card" style="display:none">
      <h2 id="sc-form-title">新增类</h2>
      <div class="grid2">
        <div>
          <div class="detail-item"><b>name</b><input type="text" id="f-name" placeholder="如 Person"></div>
          <div class="detail-item"><b>cnName</b><input type="text" id="f-cnName" placeholder="如 人物"></div>
          <div class="detail-item"><b>layer</b>
            <select id="f-layer"><option value="concept">concept</option><option value="instance">instance</option></select></div>
          <div class="detail-item"><b>keyProp</b><input type="text" id="f-keyProp" placeholder="如 name"></div>
          <div class="detail-item"><b>description</b><input type="text" id="f-desc" placeholder="描述"></div>
        </div>
        <div>
          <div class="detail-item"><b>properties</b>
            <textarea id="f-props" placeholder='[{"name":"name","cnName":"姓名","dataType":"STRING","required":true}]'></textarea></div>
          <div class="detail-item"><b>relations</b>
            <textarea id="f-rels" placeholder='[{"name":"LIVED_IN_ERA","cnName":"生活于","toClass":"Era"}] 或 []'></textarea></div>
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn" onclick="saveClass()">保存</button>
        <button class="btn ghost" onclick="hideClassForm()">取消</button>
      </div>
    </div>
  </div>
</div>
<script src="/pages/common.js"></script>
<script>
let schemaCache = null;      // { classes:[...], relations:[...] }，两 Tab 共用
let classSummaries = [];
let schemaTabLoaded = false; // 概念层 Tab 惰性加载标记

// ---------------- Tab 切换 ----------------
function switchTab(name) {
  document.querySelectorAll('.ptab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $('tab-data').style.display = name === 'data' ? '' : 'none';
  $('tab-schema').style.display = name === 'schema' ? '' : 'none';
  if (name === 'schema' && !schemaTabLoaded) {
    schemaTabLoaded = true;
    loadSchemaPanel().catch(e => showMsg('加载失败：' + e.message, false));
  }
}

// ---------------- 图数据 ----------------
function refreshDataSelectors() {
  if (!schemaCache) return;
  const labelSel = $('n-label');
  labelSel.innerHTML = schemaCache.classes
    .map(c => `<option value="${esc(c.name)}">${esc(c.name)}（${esc(c.cnName)}，key=${esc(c.keyProp)}）</option>`).join('');
  const typeSel = $('r-type');
  typeSel.innerHTML = schemaCache.relations
    .map(r => `<option value="${esc(r.name)}">${esc(r.name)}（${esc(r.fromClass)} → ${esc(r.toClass)}，${esc(r.cnName)}）</option>`).join('');
}

function nodeLoc() {
  return { label: $('n-label').value, key: $('n-key').value.trim() };
}

function queryNode() {
  const { label, key } = nodeLoc();
  if (!key) return showMsg('请输入键值', false);
  api('GET', `/api/graph/nodes/${encodeURIComponent(label)}/${encodeURIComponent(key)}`)
    .then(d => {
      const rows = d.rows || [];
      if (!rows.length) return showMsg('节点不存在', false);
      const node = rows[0].node;
      const edgeSummary = {};
      rows.forEach(r => { edgeSummary[r.relType] = (edgeSummary[r.relType] || 0) + 1; });
      const edges = Object.entries(edgeSummary).map(([t, c]) => `${t}: ${c}`).join('、');
      $('n-detail').innerHTML =
        `<h2 style="margin-bottom:8px">节点属性</h2>` +
        table(['属性', '值'], Object.entries(node).map(([k, v]) => [code(k), esc(v)])) +
        (edges ? `<div class="muted" style="margin-top:8px">关联边（LIMIT 200）：${esc(edges)}</div>` : '');
      showMsg('查询成功', true);
    }).catch(e => showMsg('失败：' + e.message, false));
}

function createNode() {
  doAction(async () => {
    const props = JSON.parse($('n-create').value || '{}');
    const label = $('n-label').value;
    const r = await api('POST', '/api/graph/nodes', { label, props });
    if ($('n-key').value.trim() === '') {
      const c = schemaCache.classes.find(c => c.name === label);
      $('n-key').value = props[c.keyProp] ?? '';
    }
    return r;
  });
}

function updateNode() {
  doAction(async () => {
    const { label, key } = nodeLoc();
    const props = JSON.parse($('n-create').value || '{}');
    return api('PUT', `/api/graph/nodes/${encodeURIComponent(label)}/${encodeURIComponent(key)}`, { props });
  });
}

function deleteNode() {
  const { label, key } = nodeLoc();
  if (!key) return showMsg('请输入键值', false);
  if (!confirm(`确认删除节点 ${label}/${key}？（默认 detach：连带删除其关系）`)) return;
  doAction(async () =>
    api('DELETE', `/api/graph/nodes/${encodeURIComponent(label)}/${encodeURIComponent(key)}?detach=true`));
}

function relBody() {
  const type = $('r-type').value;
  const d = schemaCache.relations.find(r => r.name === type);
  const props = JSON.parse($('r-props').value || '{}');
  return { type, fromLabel: d.fromClass, fromKey: $('r-from').value.trim(),
           toLabel: d.toClass, toKey: $('r-to').value.trim(), props };
}

function createRel() {
  doAction(async () => api('POST', '/api/graph/relations', relBody()));
}
function updateRel() {
  doAction(async () => api('PUT', '/api/graph/relations', relBody()));
}
function deleteRel() {
  if (!confirm('确认删除该关系？')) return;
  const b = relBody();
  doAction(async () => api('DELETE', '/api/graph/relations', b));
}

// ---------------- 概念层 ----------------
async function loadSchemaPanel() {
  classSummaries = await api('GET', '/api/schema/classes');
  schemaCache = await api('GET', '/api/schema');
  $('sc-classes').innerHTML = table(
    ['类名', '中文名', '层', 'keyProp', '实例数', '属性', '出边关系', '操作'],
    classSummaries.map(c => [
      code(c.name), esc(c.cnName), badge(c.layer), code(c.keyProp), c.count,
      c.propertyCount, c.relationCount,
      `<button class="btn sm" onclick="showClassDetail('${esc(c.name)}')">详情</button>` +
      `<button class="btn sm ghost" onclick="editClass('${esc(c.name)}')">编辑</button>` +
      `<button class="btn sm danger" onclick="removeClass('${esc(c.name)}')">删除</button>`
    ]));
  refreshDataSelectors();   // 概念层变更后联动刷新图数据下拉框
}

async function showClassDetail(name) {
  const d = await api('GET', '/api/schema/classes/' + encodeURIComponent(name));
  $('sc-detail-card').style.display = 'block';
  $('sc-detail-name').textContent = name;
  const props = d.properties.map(p =>
    `<tr><td>${code(p.name)}</td><td>${esc(p.cnName)}</td><td>${p.dataType}</td>` +
    `<td>${p.required ? '是' : '否'}</td><td>${esc(p.description || '')}</td></tr>`).join('');
  const rels = d.relations.map(r =>
    `<tr><td>${code(r.name)}</td><td>${esc(r.cnName)}</td><td>${code(d.name)} → ${code(r.toClass)}</td>` +
    `<td>${r.count}</td><td>${esc(r.example || '')}</td></tr>`).join('');
  const incoming = d.incomingRelations.map(r =>
    `<tr><td>${code(r.name)}</td><td>${esc(r.cnName)}</td><td>${code(r.fromClass)} → ${code(d.name)}</td>` +
    `<td>${r.count}</td></tr>`).join('');
  $('sc-detail').innerHTML =
    `<div class="detail-item"><b>描述</b>${esc(d.description || '')}</div>` +
    `<h2 style="margin:10px 0 8px">属性（${d.properties.length}）</h2>` +
    `<table><tr><th>属性</th><th>中文名</th><th>类型</th><th>必填</th><th>说明</th></tr>${props}</table>` +
    (rels ? `<h2 style="margin:14px 0 8px">出边关系（声明，${d.relations.length}）</h2>` +
      `<table><tr><th>关系</th><th>中文名</th><th>方向</th><th>实例数</th><th>示例</th></tr>${rels}</table>` : '') +
    (incoming ? `<h2 style="margin:14px 0 8px">入边关系（推导，${d.incomingRelations.length}）</h2>` +
      `<table><tr><th>关系</th><th>中文名</th><th>方向</th><th>实例数</th></tr>${incoming}</table>` : '');
  $('sc-detail-card').scrollIntoView({ behavior: 'smooth' });
}

function editClass(name) {
  $('sc-form-card').style.display = 'block';
  if (name) {
    const c = schemaCache.classes.find(c => c.name === name);
    $('sc-form-title').textContent = '编辑类：' + name;
    $('f-name').value = c.name; $('f-name').disabled = true;
    $('f-cnName').value = c.cnName; $('f-layer').value = c.layer;
    $('f-keyProp').value = c.keyProp; $('f-keyProp').disabled = true;
    $('f-desc').value = c.description || '';
    $('f-props').value = JSON.stringify(c.properties, null, 1);
    $('f-rels').value = JSON.stringify(c.relations.map(({name, cnName, toClass, description, example, props}) =>
      ({name, cnName, toClass, description, example, props})), null, 1);
  } else {
    $('sc-form-title').textContent = '新增类';
    ['f-name', 'f-cnName', 'f-keyProp', 'f-desc', 'f-props', 'f-rels'].forEach(i => $(i).value = '');
    $('f-name').disabled = false; $('f-keyProp').disabled = false;
    $('f-layer').value = 'concept';
    $('f-props').value = '[{"name":"name","cnName":"名称","dataType":"STRING","required":true}]';
    $('f-rels').value = '[]';
  }
  $('sc-form-card').scrollIntoView({ behavior: 'smooth' });
}

function hideClassForm() { $('sc-form-card').style.display = 'none'; }

function saveClass() {
  doAction(async () => {
    const body = {
      name: $('f-name').value.trim(), cnName: $('f-cnName').value.trim(),
      layer: $('f-layer').value, keyProp: $('f-keyProp').value.trim(),
      description: $('f-desc').value.trim(),
      properties: JSON.parse($('f-props').value || '[]'),
      relations: JSON.parse($('f-rels').value || '[]')
    };
    const editing = !$('f-name').disabled;
    const r = editing
      ? await api('PUT', '/api/schema/classes/' + encodeURIComponent(body.name), body)
      : await api('POST', '/api/schema/classes', body);
    hideClassForm();
    await loadSchemaPanel();
    return r;
  });
}

function removeClass(name) {
  if (!confirm('确认删除类 ' + name + '？\n（被引用或仍有实例会被拒绝 409）')) return;
  doAction(async () => {
    const r = await api('DELETE', '/api/schema/classes/' + encodeURIComponent(name));
    await loadSchemaPanel();
    $('sc-detail-card').style.display = 'none';
    return r;
  });
}

// ---------------- init ----------------
CF.renderHeader();
CF.initUser();
api('GET', '/api/schema').then(d => { schemaCache = d; refreshDataSelectors(); })
  .catch(e => showMsg('加载失败：' + e.message, false));
</script>
</body>
</html>
